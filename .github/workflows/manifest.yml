# Keeps js/data/manifest.js (and the js/data/* entries in sw.js) in sync with
# the files in js/data/, so adding / removing an element data file on GitHub
# needs no other edit. Locally: node tools/build-manifest.js
name: Rebuild data manifest
on:
  push:
    branches: [main]
    paths: ['js/data/**', 'tools/build-manifest.js']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/build-manifest.js
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/data/manifest.js sw.js
            git commit -m "Rebuild data manifest"
            git push
          fi
