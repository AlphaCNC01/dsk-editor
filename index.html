// ============================================================================
// Drawing — composes every registered element's contours into one flat list
// of { contour, layer } entries. This is the single artifact that both the
// SVG preview and the DXF exporter consume; neither needs to know how many
// elements exist or how each one builds its geometry.
// ============================================================================
const Drawing = (() => {
  function build(params){
    const entries = [];
    for (const element of Elements.all()){
      const parts = element.buildContours(params) || [];
      for (const part of parts) entries.push(part);
    }
    return entries;
  }
  return { build };
})();


// ============================================================================
// Dimensions — draws linear dimension lines (extension lines, a dimension
// line, inward-pointing arrowheads, and a centered text label) for the
// tabletop's overall width and height. Built from the same plain-line
// contour primitives as everything else in this app (open, non-filled
// contours on the DIMENSIONS layer) rather than DXF's native DIMENSION
// entity — R12 doesn't support DIMENSION at all, and every other design
// choice in this app already favors plain, universally-compatible
// primitives over format-specific entity types.
//
// This only dimensions the overall tabletop for now; per-element
// dimensions (individual cutout sizes, distances between elements) are a
// natural next step on the same buildLinearDimension() primitive, not
// built out yet since only the overall envelope was requested.
// ============================================================================
const Dimensions = (() => {
  const EXT_GAP = 4;        // gap between the dimensioned feature and where its extension line starts
  const EXT_OVERSHOOT = 4;  // how far the extension line extends past the dimension line itself
  const ARROW_LEN = 16;      // distance from an arrowhead's tip back to its tail, along the dimension line
  const ARROW_WIDTH = 6;
  const TEXT_GAP = 18;       // distance from the dimension line to the text's own geometric CENTER (not its baseline/edge — see dominant-baseline="central" in RenderSVG/ExportSVG and DXF group code 73 in ExportDXF), so the visual gap reads the same whether the text ends up above or below the line

  // Auto-stacking: every dimension call below picks a "desired" offset on
  // the general vicinity of what it's measuring, but on a busy drawing
  // several dimensions can legitimately want to sit at roughly the same
  // distance from roughly the same span (e.g. two chargers placed near
  // each other, or a tray next to the underframe), which used to just
  // overlap. STACK_STEP is how far a dimension gets pushed out, on top of
  // its own requested offset, for each already-placed dimension it would
  // otherwise collide with — see placeDimension below for the actual
  // collision search.
  const STACK_STEP = 34; // TEXT_GAP*2-ish: enough for one line + label not to touch the next
  const placedByAxis = { h: [], v: [] }; // reset per build() call, see resetStacking()

  function resetStacking(){
    placedByAxis.h.length = 0;
    placedByAxis.v.length = 0;
  }

  // Finds the smallest offset (same sign and axis as requested, magnitude
  // >= the requested one) whose dimension-line band doesn't overlap any
  // previously placed dimension that shares its span AND its base
  // coordinate. "Span" is the dimension's extent along its own direction
  // (e.g. a horizontal dimension's x-range); "base" is the coordinate the
  // offset is measured from (e.g. a horizontal dimension's own y, before
  // the offset is applied) — two dimensions can only collide if their
  // spans overlap, they're on the same side (same offset sign), AND they
  // share the same base, since dimensions measured from different base
  // lines (e.g. the underframe's own inset vs. the pult's own inset,
  // which sit on different y-coordinates entirely) never visually
  // interfere with each other regardless of offset.
  function placeDimension(axis, base, spanMin, spanMax, desiredOffset){
    const sign = desiredOffset >= 0 ? 1 : -1;
    const placed = placedByAxis[axis];
    let offset = desiredOffset;
    // Re-check from scratch each time offset changes, since pushing past
    // one collision can land inside another's band — a fixed-point loop
    // (rather than a single pass) is what makes this correct for 3+
    // overlapping dimensions stacked on the same side, not just 2.
    let changed = true;
    while (changed) {
      changed = false;
      for (const entry of placed) {
        if (entry.sign !== sign || entry.base !== base) continue;
        const overlaps = spanMin < entry.spanMax && spanMax > entry.spanMin;
        if (!overlaps) continue;
        const tooClose = Math.abs(Math.abs(offset) - Math.abs(entry.offset)) < STACK_STEP;
        if (tooClose) {
          offset = sign * (Math.abs(entry.offset) + STACK_STEP);
          changed = true;
        }
      }
    }
    placed.push({ spanMin, spanMax, offset, sign, base });
    return offset;
  }

  // Builds one linear dimension between p1 and p2, offset perpendicular to
  // the p1->p2 direction by `offset` (signed — sign picks which side the
  // dimension line sits on). Returns entries (open contours for the
  // extension lines, dimension line, and two arrowhead triangles) plus one
  // text label.
  //
  // The requested `offset` is treated as a minimum/preferred distance —
  // placeDimension may push it further out if it would otherwise overlap
  // an already-placed dimension covering the same span on the same side,
  // so two nearby measurements always end up stacked instead of on top of
  // each other. This only works for axis-aligned dimensions (p1.x===p2.x
  // or p1.y===p2.y), which covers every dimension this app draws.
  function buildLinearDimension(p1, p2, offset, formatText){
    const isHorizontal = p1.y === p2.y;
    const isVertical = p1.x === p2.x;
    if (isHorizontal || isVertical) {
      const axis = isHorizontal ? 'h' : 'v';
      const base = isHorizontal ? p1.y : p1.x;
      const spanMin = isHorizontal ? Math.min(p1.x, p2.x) : Math.min(p1.y, p2.y);
      const spanMax = isHorizontal ? Math.max(p1.x, p2.x) : Math.max(p1.y, p2.y);
      offset = placeDimension(axis, base, spanMin, spanMax, offset);
    }
    // A genuinely diagonal dimension (p1.x!==p2.x && p1.y!==p2.y) skips
    // stacking entirely and just uses its requested offset as-is — none
    // of this app's own dimensions are diagonal today, but a future one
    // shouldn't silently misbehave by being forced through the axis-only
    // collision model above.

    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;   // unit vector along the dimension
    const nx = -uy, ny = ux;              // unit vector perpendicular to it
    const sign = offset >= 0 ? 1 : -1;
    const absOffset = Math.abs(offset);

    const d1 = { x: p1.x + nx * offset, y: p1.y + ny * offset };
    const d2 = { x: p2.x + nx * offset, y: p2.y + ny * offset };

    const e1Start = { x: p1.x + nx * EXT_GAP * sign, y: p1.y + ny * EXT_GAP * sign };
    const e1End   = { x: p1.x + nx * (absOffset + EXT_OVERSHOOT) * sign, y: p1.y + ny * (absOffset + EXT_OVERSHOOT) * sign };
    const e2Start = { x: p2.x + nx * EXT_GAP * sign, y: p2.y + ny * EXT_GAP * sign };
    const e2End   = { x: p2.x + nx * (absOffset + EXT_OVERSHOOT) * sign, y: p2.y + ny * (absOffset + EXT_OVERSHOOT) * sign };

    // The arrowhead's tip sits exactly at the dimension line's endpoint
    // (d1 or d2) and points OUTWARD — away from the other endpoint, i.e.
    // toward p1's/p2's own side. The tail (the wide base of the triangle)
    // is ARROW_LEN back from the tip, toward the other endpoint. Passing
    // each arrow its own outward direction (rather than reusing the
    // line's own ux/uy for both ends) is what keeps the tip-vs-tail sides
    // correct without needing a sign trick on ARROW_LEN.
    function arrowTriangle(tip, dirOutward){
      const backX = tip.x - ARROW_LEN * dirOutward.x, backY = tip.y - ARROW_LEN * dirOutward.y;
      const perpX = -dirOutward.y, perpY = dirOutward.x;
      return [
        { x: tip.x, y: tip.y, bulge: 0 },
        { x: backX + perpX * ARROW_WIDTH / 2, y: backY + perpY * ARROW_WIDTH / 2, bulge: 0 },
        { x: backX - perpX * ARROW_WIDTH / 2, y: backY - perpY * ARROW_WIDTH / 2, bulge: 0 },
      ];
    }

    const entries = [
      { contour: [{ x: e1Start.x, y: e1Start.y, bulge: 0 }, { x: e1End.x, y: e1End.y, bulge: 0 }], layer: 'DIMENSIONS', closed: false },
      { contour: [{ x: e2Start.x, y: e2Start.y, bulge: 0 }, { x: e2End.x, y: e2End.y, bulge: 0 }], layer: 'DIMENSIONS', closed: false },
      { contour: [{ x: d1.x, y: d1.y, bulge: 0 }, { x: d2.x, y: d2.y, bulge: 0 }], layer: 'DIMENSIONS', closed: false },
      { contour: arrowTriangle(d1, { x: -ux, y: -uy }), layer: 'DIMENSIONS', closed: true },
      { contour: arrowTriangle(d2, { x: ux, y: uy }), layer: 'DIMENSIONS', closed: true },
    ];

    const midX = (d1.x + d2.x) / 2 + nx * TEXT_GAP * sign;
    const midY = (d1.y + d2.y) / 2 + ny * TEXT_GAP * sign;
    // Constrain the label's rotation to never read upside-down: a
    // dimension can point in any of the 4 directions along its axis
    // (e.g. the charger's inset dimension flips direction depending on
    // which anchor is selected), but the text should always read normally
    // left-to-right — so angles more than 90° from horizontal get flipped
    // by 180°. This preserves intentional choices like the height
    // dimension's bottom-to-top reading (90°) while fixing any dimension
    // that happens to run right-to-left or top-to-bottom.
    let textAngle = Math.atan2(dy, dx);
    if (textAngle > Math.PI / 2 || textAngle <= -Math.PI / 2) {
      textAngle += Math.PI;
      if (textAngle > Math.PI) textAngle -= 2 * Math.PI;
    }
    const texts = [{ x: midX, y: midY, text: formatText(len), angle: textAngle }];

    return { entries, texts };
  }

  function formatMm(len){
    const rounded = Math.round(len * 10) / 10;
    return (Number.isInteger(rounded) ? rounded : rounded.toFixed(1)) + ' мм';
  }

  // Builds the overall width/height dimensions for the tabletop, plus
  // dimension lines for every other configurable measurement (notch
  // widths/heights, element insets) except fillet radii, which the user
  // asked to leave undimensioned. Offsets/insets that default to zero are
  // only dimensioned when the person has actually set them to something
  // else — a zero offset has nothing meaningful to measure.
  function build(params){
    if (!params.dimensionsOn) return { entries: [], texts: [] };
    resetStacking(); // fresh collision state for this build — each call to Dimensions.build lays out an independent drawing
    const { W, H } = params;
    const gap = 30; // distance the overall dimension lines sit from the tabletop's own edge
    const entries = [];
    const texts = [];

    function add(dim){ entries.push(...dim.entries); texts.push(...dim.texts); }

    // Overall width (below) and height (left).
    add(buildLinearDimension({ x: 0, y: 0 }, { x: W, y: 0 }, -gap, formatMm));
    add(buildLinearDimension({ x: 0, y: 0 }, { x: 0, y: H }, gap, formatMm));

    // Bottom trapezoid notch: width at the tabletop's bottom edge, width at
    // the notch's own flat top, and its height.
    if (params.notchOn) {
      const cx = W / 2;
      const nBL = { x: cx - params.notchBottom / 2, y: 0 };
      const nBR = { x: cx + params.notchBottom / 2, y: 0 };
      const nTL = { x: cx - params.notchTop / 2, y: params.notchH };
      const nTR = { x: cx + params.notchTop / 2, y: params.notchH };
      // Stacked further out (gap 60) than the overall width dimension
      // (gap 30), since both sit on the same bottom edge.
      add(buildLinearDimension(nBL, nBR, -60, formatMm));
      // The notch's flat top isn't on the tabletop's own edge, so its
      // width is dimensioned as an internal line just above that edge.
      add(buildLinearDimension(nTL, nTR, 12, formatMm));
      // Height: a local vertical dimension just to the right of the
      // notch, inside the tabletop — the left side is already used by
      // the overall height dimension.
      add(buildLinearDimension({ x: nBR.x, y: 0 }, { x: nBR.x, y: params.notchH }, 15, formatMm));
    }

    // Top notch (T-slot or rectangular): width, and horizontal offset
    // from center only when the person has actually shifted it.
    if (params.topNotchType !== 'none') {
      const cx = W / 2 + params.topNotchOffset;
      const half = params.topNotchWidth / 2;
      // Placed above the tabletop (mirrors the overall-width placement
      // pattern, but on the opposite edge, so it never collides with the
      // bottom-notch stack).
      add(buildLinearDimension({ x: cx - half, y: H }, { x: cx + half, y: H }, gap, formatMm));
      if (params.topNotchOffset !== 0) {
        add(buildLinearDimension({ x: W / 2, y: H }, { x: cx, y: H }, gap + 25, formatMm));
      }
    }

    // Shared per-instance dimensioning for anchor-based embeddable
    // elements: draws a short local line from the resolved anchor point
    // to the element's own center along each axis, skipping zero insets
    // so nothing draws a zero-length "phantom" dimension. Both axes are
    // always dimensioned now — insetX/insetY are always meaningful
    // (directional distance for a corner axis, or a signed left/right or
    // up/down shift for an edge-center/center axis), matching how
    // Elements.resolveInset resolves the same instances' actual position.
    function dimensionInstanceList(instances){
      for (const instance of (instances || [])) {
        if (instance.dimensionsOn === false) continue;
        const bounds = { minX: 0, minY: 0, maxX: W, maxY: H };
        const anchorPt = Elements.resolveAnchor(instance.anchor, { x: 0, y: 0 }, bounds);
        const center = Elements.resolveInset(instance.anchor, instance.insetX, instance.insetY, bounds);
        if (instance.insetX) {
          add(buildLinearDimension({ x: anchorPt.x, y: center.y }, { x: center.x, y: center.y }, 10, formatMm));
        }
        if (instance.insetY) {
          add(buildLinearDimension({ x: center.x, y: anchorPt.y }, { x: center.x, y: center.y }, 10, formatMm));
        }
      }
    }

    // All embeddable elements now share the same instance dimensioning,
    // since resolveItems() in the UI managers already computed any
    // dynamic defaults (e.g. USB/pult following the underframe).
    dimensionInstanceList(params.chargers);
    dimensionInstanceList(params.outletBlocks);
    dimensionInstanceList(params.phoneStands);
    dimensionInstanceList(params.trays);
    dimensionInstanceList(params.pullouts);
    dimensionInstanceList(params.usbChargers);
    dimensionInstanceList(params.pults);

    // Underframe: dimension each inset only when nonzero. The horizontal
    // inset measures directly from the tabletop's left edge (its own
    // definition). The vertical inset is a shift away from the frame's
    // centered reference position, so it's dimensioned as that shift, not
    // as the full distance from the tabletop's center.
    if (params.underframeType !== 'none') {
      const data = Elements.all().find(e => e.id === 'underframe').VARIANTS[params.underframeType];
      if (data) {
        const insetH = params.underframeInsetH;
        const insetV = params.underframeInsetV || 0;
        const centeredTopY = H / 2 + data.height / 2;
        const actualTopY = centeredTopY + insetV;
        if (insetH !== 0) {
          add(buildLinearDimension({ x: 0, y: actualTopY + 10 }, { x: insetH, y: actualTopY + 10 }, 0, formatMm));
        }
        if (insetV !== 0) {
          add(buildLinearDimension({ x: -15, y: centeredTopY }, { x: -15, y: actualTopY }, 0, formatMm));
        }
      }
    }

    return { entries, texts };
  }

  return { build, buildLinearDimension, formatMm };
})();


// ============================================================================
// Render.SVG — Drawing -> <svg> markup for the preview pane. Draws every
// contour with a style keyed by its layer, so future layers (underframe
// holes, element cutouts) are visually distinguishable without extra work
// per element.
// ============================================================================
const RenderSVG = (() => {
  const LAYER_CLASS = {
    OUTLINE: 'layer-outline',
    UNDERFRAME: 'layer-underframe',
    UNDERFRAME_HOLES: 'layer-underframe-holes',
    ELEMENTS: 'layer-elements',
    ELEMENTS_BACK: 'layer-elements-back',
    DIMENSIONS: 'layer-dimensions',
  };

  function build(entries, W, H, texts = []){
    const parts = entries.map(({ contour, layer, closed = true }) => {
      const d = Geo.contourToSvgPath(contour, true, H, closed);
      // A contour naming a layer that isn't in the registry gets flagged
      // visually (layer-unknown, a blinking red outline — see its CSS)
      // instead of silently falling back to layer-outline as this used
      // to — that fallback was hiding the exact mistake this is meant to
      // surface (an element referencing a layer id that doesn't exist).
      const cls = LAYER_CLASS[layer] || 'layer-unknown';
      const fillAttr = closed ? '' : ' style="fill:none"'; // open lines/arrowheads shouldn't inherit the layer's closed-shape fill
      return `<path class="${cls}"${fillAttr} d="${d}"></path>`;
    });
    const textParts = texts.map(({ x, y, text, angle = 0 }) => {
      const sy = H - y; // flip to SVG's Y-down space, matching contourToSvgPath's own flip
      const deg = -angle * 180 / Math.PI; // SVG rotation is clockwise-positive in Y-down space, opposite of our CAD angle convention
      return `<text class="layer-dimensions dim-text" x="${x}" y="${sy}" transform="rotate(${deg} ${x} ${sy})" text-anchor="middle" dominant-baseline="central">${text}</text>`;
    });
    return parts.join('\n') + (textParts.length ? '\n' + textParts.join('\n') : '');
  }

  return { build };
})();


// ============================================================================
// Export.DXF — Drawing -> DXF R12 (AC1009) text. R12 was chosen (over the
// newer LWPOLYLINE-based R2000+) because it only needs HEADER + TABLES +
// ENTITIES with simple name references — no owner-handle bookkeeping — and
// is read by effectively every DXF-capable tool. Each layer gets its own
// POLYLINE per contour, grouped under a proper LAYER table so names/colors
// appear correctly in any CAD layer manager, including layers with no
// geometry yet (reserved for planned features).
// ============================================================================
const ExportDXF = (() => {
  const ARC_SEGMENTS_PER_CIRCLE = 128; // keeps tessellated arcs visually smooth

  function buildLayerTable(add){
    const layers = Layers.all();
    add(0,'SECTION'); add(2,'TABLES');
    add(0,'TABLE'); add(2,'LAYER'); add(70, layers.length);
    for (const layer of layers){
      add(0,'LAYER');
      add(2, layer.name);
      add(70, 0);
      add(62, layer.color);
      add(6, 'CONTINUOUS');
    }
    add(0,'ENDTAB');
    add(0,'ENDSEC');
  }

  function buildEntities(add, entries, texts){
    add(0,'SECTION'); add(2,'ENTITIES');
    for (const { contour, layer, closed = true } of entries){
      // An entry referencing a layer not in the registry still gets
      // written out (using the raw layer string as its DXF layer name)
      // rather than silently reassigned to a known layer or dropped —
      // the person sees this case highlighted in the on-screen preview
      // (see RenderSVG's own unknown-layer handling) so they can fix the
      // element that produced it; the export just needs to not crash.
      const known = Layers.get(layer);
      const layerName = known ? known.name : layer;
      const points = Geo.tessellateContour(contour, ARC_SEGMENTS_PER_CIRCLE, closed);

      add(0,'POLYLINE');
      add(8, layerName);
      add(66,1);   // "vertices follow" marker, required for POLYLINE
      add(70, closed ? 1 : 0);
      add(40,0);   // default start width
      add(41,0);   // default end width

      for (const pt of points){
        add(0,'VERTEX');
        add(8, layerName);
        add(10, Geo.cleanRound(pt.x).toFixed(4));
        add(20, Geo.cleanRound(pt.y).toFixed(4));
        add(30, 0);
      }

      add(0,'SEQEND');
      add(8, layerName);
    }

    const TEXT_HEIGHT_MM = 21;
    for (const { x, y, text, angle = 0 } of (texts || [])){
      const cx = Geo.cleanRound(x), cy = Geo.cleanRound(y);
      add(0,'TEXT');
      add(8, Layers.get('DIMENSIONS').name);
      add(10, cx.toFixed(4));
      add(20, cy.toFixed(4));
      add(30, 0);
      add(40, TEXT_HEIGHT_MM);
      add(1, text);
      add(50, (angle * 180 / Math.PI).toFixed(4)); // DXF rotation is degrees, CCW from X-axis — matches our CAD angle convention directly, no flip needed
      add(72, 1); // horizontal alignment: center
      add(73, 2); // vertical alignment: middle — matches the SVG side's dominant-baseline="central", so (x,y) means the text's true geometric center in both outputs, not its baseline
      add(11, cx.toFixed(4)); // alignment point, required when 72/73 are nonzero
      add(21, cy.toFixed(4));
      add(31, 0);
    }

    add(0,'ENDSEC');
  }

  function build(entries, texts){
    const lines = [];
    const add = (code, value) => { lines.push(String(code)); lines.push(String(value)); };

    add(0,'SECTION'); add(2,'HEADER');
    add(9,'$ACADVER'); add(1,'AC1009');
    add(0,'ENDSEC');

    buildLayerTable(add);
    buildEntities(add, entries, texts);

    add(0,'EOF');
    return lines.join('\r\n') + '\r\n';
  }

  function downloadAs(entries, filename, texts){
    let name = (filename || 'panel').trim();
    if (!name) name = 'panel';
    if (!/\.dxf$/i.test(name)) name += '.dxf';

    const dxfText = build(entries, texts);
    const blob = new Blob([dxfText], { type: 'application/dxf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { build, downloadAs };
})();


// ============================================================================
// Export.SVG — Drawing -> a standalone, downloadable SVG file. Distinct from
// RenderSVG (which builds inline preview markup styled by the app's own
// CSS): an exported file has to carry its own styling, since it will be
// opened outside this app. Uses the same per-layer color scheme as the
// preview and the DXF layer table, so the exported file visually matches
// what was on screen. Coordinates are written in real millimeters with an
// explicit mm-based viewBox/width/height, and Y is flipped to match SVG's
// native top-down convention (the same flip RenderSVG applies for on-screen
// display) so the file opens right-side-up in any SVG viewer.
// ============================================================================
const ExportSVG = (() => {
  const BBOX_MARGIN_MM = 6; // extra breathing room around the computed content bounds, beyond the geometry itself

  // Computes the true bounding box across every entry's contour points and
  // every text label's approximate footprint. Dimension lines/arrows/text
  // routinely extend outside the tabletop's own [0,W]x[0,H] footprint, so
  // sizing the export purely off W/H clips them — this walks the actual
  // geometry instead of assuming any fixed extent.
  function computeBounds(entries, texts, W, H){
    let minX = 0, minY = 0, maxX = W, maxY = H; // tabletop itself is always included
    for (const { contour } of entries){
      for (const v of contour){
        if (v.x < minX) minX = v.x;
        if (v.x > maxX) maxX = v.x;
        if (v.y < minY) minY = v.y;
        if (v.y > maxY) maxY = v.y;
      }
    }
    // Text labels aren't stored as contour points, so approximate each
    // one's footprint from its position — rotated text can extend in
    // either axis regardless of the label's own orientation, so a
    // generous square margin around the anchor point is simpler and safer
    // than trying to compute exact rotated-text extents.
    const TEXT_FOOTPRINT_MM = 85; // half-width allowance for a realistic label (DIM_TEXT_HEIGHT_MM-tall monospace, ~7-8 characters like "1500 мм") — width dominates over height for these short numeric+unit labels
    for (const { x, y } of texts){
      if (x - TEXT_FOOTPRINT_MM < minX) minX = x - TEXT_FOOTPRINT_MM;
      if (x + TEXT_FOOTPRINT_MM > maxX) maxX = x + TEXT_FOOTPRINT_MM;
      if (y - TEXT_FOOTPRINT_MM < minY) minY = y - TEXT_FOOTPRINT_MM;
      if (y + TEXT_FOOTPRINT_MM > maxY) maxY = y + TEXT_FOOTPRINT_MM;
    }
    return {
      minX: minX - BBOX_MARGIN_MM, minY: minY - BBOX_MARGIN_MM,
      maxX: maxX + BBOX_MARGIN_MM, maxY: maxY + BBOX_MARGIN_MM,
    };
  }

  // Mirrors RenderSVG's LAYER_CLASS intent, but as concrete stroke/fill
  // colors baked into the file instead of CSS classes, since an exported
  // file can't depend on this app's stylesheet.
  const LAYER_STYLE = {
    OUTLINE:          { stroke: '#ff8a3d', fill: 'none' },
    UNDERFRAME:       { stroke: '#4d8ff0', fill: 'none' },
    UNDERFRAME_HOLES: { stroke: '#b06fe0', fill: 'none' },
    ELEMENTS:         { stroke: '#4cc97c', fill: 'none' },
    ELEMENTS_BACK:    { stroke: '#4dcfe0', fill: 'none' },
    DIMENSIONS:       { stroke: '#e05a5a', fill: '#e05a5a' },
  };
  const BASE_STROKE_WIDTH_MM = 1; // stroke width in the drawing's own mm units — deliberately NOT vector-effect:non-scaling-stroke, since that keeps strokes hairline-thin in CSS pixels no matter how large the file is rasterized (e.g. for PNG export); specifying width in mm makes it scale naturally with resolution

  // Dimension label text height, in the drawing's own mm units. The
  // on-screen preview's text (see .dim-text in the stylesheet) is a FIXED
  // number of screen pixels regardless of table size, so it always looks
  // the same relative size on screen. Exported text is real mm on the
  // drawing, so once rasterized to a typically much larger PNG (e.g.
  // 3000px+ wide for a 1500mm table) and then viewed at reduced zoom in an
  // image viewer, the same nominal size reads much smaller than the fixed-
  // px preview. This value is deliberately large (much bigger than a
  // literal drafting-standard text height) to compensate for that —
  // tune it here if exports still look too small or too large relative to
  // the preview.
  const DIM_TEXT_HEIGHT_MM = 21;

  // strokeWidthMultiplier scales BASE_STROKE_WIDTH_MM up or down — exposed
  // as a parameter (rather than hardcoded) so line thickness can be tuned
  // per export without hunting through the function body.
  function build(entries, W, H, texts = [], strokeWidthMultiplier = 1){
    const bounds = computeBounds(entries, texts, W, H);
    const bw = bounds.maxX - bounds.minX, bh = bounds.maxY - bounds.minY;
    // contourToSvgPath's Y-flip is anchored at H (world y=0 -> svg y=H,
    // world y=H -> svg y=0); that formula stays correct for points outside
    // [0,H] too, so only the viewBox's origin/size need to grow to reveal
    // them — the flip math itself doesn't change.
    const svgMinY = H - bounds.maxY;

    const strokeWidth = BASE_STROKE_WIDTH_MM * strokeWidthMultiplier;
    const paths = entries.map(({ contour, layer, closed = true }) => {
      // Round each vertex before it hits the path string, same rationale
      // as the DXF exporter's cleanRound — this is a final-output
      // checkpoint (unlike the live on-screen preview via RenderSVG,
      // which skips this for performance since it re-renders on every
      // keystroke and doesn't need the extra decimal-place cleanup).
      const roundedContour = contour.map(v => ({ x: Geo.cleanRound(v.x), y: Geo.cleanRound(v.y), bulge: v.bulge }));
      const d = Geo.contourToSvgPath(roundedContour, true, H, closed);
      const style = LAYER_STYLE[layer] || LAYER_STYLE.OUTLINE;
      const fill = closed ? style.fill : 'none';
      return `<path d="${d}" fill="${fill}" stroke="${style.stroke}" stroke-width="${strokeWidth}"/>`;
    });
    const textEls = texts.map(({ x, y, text, angle = 0 }) => {
      const sy = H - y;
      const deg = -angle * 180 / Math.PI;
      const dimStyle = LAYER_STYLE.DIMENSIONS;
      return `<text x="${x}" y="${sy}" transform="rotate(${deg} ${x} ${sy})" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-weight="bold" font-size="${DIM_TEXT_HEIGHT_MM}" fill="${dimStyle.stroke}" stroke="none">${text}</text>`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n` +
      `<svg xmlns="http://www.w3.org/2000/svg" width="${bw}mm" height="${bh}mm" viewBox="${bounds.minX} ${svgMinY} ${bw} ${bh}">\n` +
      paths.join('\n') + '\n' +
      textEls.join('\n') + '\n' +
      `</svg>\n`;
  }

  function downloadAs(entries, W, H, filename, texts, strokeWidthMultiplier){
    let name = (filename || 'panel').trim();
    if (!name) name = 'panel';
    if (!/\.svg$/i.test(name)) name += '.svg';

    const svgText = build(entries, W, H, texts, strokeWidthMultiplier);
    const blob = new Blob([svgText], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { build, downloadAs, computeBounds };
})();


// ============================================================================
// Export.PNG — rasterizes the same drawing ExportSVG produces into a PNG
// file, entirely in the browser (Image + Canvas, no server or library).
// Since the drawing lives in millimeters with no inherent pixel size, the
// caller supplies a scale in pixels-per-mm; the canvas is sized to
// W*scale × H*scale so the exported bitmap has a predictable, consistent
// resolution regardless of on-screen zoom. A solid white background is
// painted first — the SVG itself has no background, and a transparent PNG
// of thin colored lines is hard to read in most image viewers/printers.
// ============================================================================
const ExportPNG = (() => {
  const DEFAULT_SCALE = 2;               // pixels per mm — the UI no longer exposes this, but it's easy to change here if a different default is ever needed
  const DEFAULT_STROKE_WIDTH_MULTIPLIER = 1.5; // multiplies ExportSVG's base stroke width (see BASE_STROKE_WIDTH_MM there) — raise this if lines are still too thin
  const BORDER_MARGIN_MM = 50;           // gap between the drawing's own edge and the border
  const BORDER_WIDTH_MM = 0;           // border line thickness, in the same mm units as the drawing

  function rasterize(entries, W, H, texts, scale = DEFAULT_SCALE, strokeWidthMultiplier = DEFAULT_STROKE_WIDTH_MULTIPLIER){
    return new Promise((resolve, reject) => {
      const svgText = ExportSVG.build(entries, W, H, texts, strokeWidthMultiplier);
      const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);

      // The SVG's own content may extend beyond the tabletop's W×H (e.g.
      // dimension lines) — size the canvas off the same bounding box
      // ExportSVG.build used for its viewBox, not the raw tabletop
      // dimensions, or anything outside W×H gets cropped off the PNG.
      const bounds = ExportSVG.computeBounds(entries, texts, W, H);
      const contentW = bounds.maxX - bounds.minX, contentH = bounds.maxY - bounds.minY;

      const img = new Image();
      img.onload = () => {
        const margin = BORDER_MARGIN_MM * scale;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(contentW * scale + margin * 2));
        canvas.height = Math.max(1, Math.round(contentH * scale + margin * 2));
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, margin, margin, contentW * scale, contentH * scale);

        const borderWidth = BORDER_WIDTH_MM * scale;
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = borderWidth;
        ctx.strokeRect(borderWidth / 2, borderWidth / 2, canvas.width - borderWidth, canvas.height - borderWidth);

        URL.revokeObjectURL(svgUrl);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('canvas.toBlob returned null'));
        }, 'image/png');
      };
      img.onerror = () => {
        URL.revokeObjectURL(svgUrl);
        reject(new Error('Failed to rasterize SVG for PNG export'));
      };
      img.src = svgUrl;
    });
  }

  async function downloadAs(entries, W, H, filename, texts, scale, strokeWidthMultiplier){
    let name = (filename || 'panel').trim();
    if (!name) name = 'panel';
    if (!/\.png$/i.test(name)) name += '.png';

    const blob = await rasterize(entries, W, H, texts, scale, strokeWidthMultiplier);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { rasterize, downloadAs };
})();


// ============================================================================
// UI — wires the parameter form to Drawing / RenderSVG / ExportDXF. Kept
// deliberately thin: it only reads inputs into a plain params object, asks
// Drawing for the current geometry, and hands that to the renderer or
// exporter. No geometry logic lives here.
// ============================================================================
(function UI(){
  const el = id => document.getElementById(id);

  // ---------- Generic instance-list manager ----------
  // Every repeatable element (chargers, outlet blocks, phone stands,
  // trays, pull-out stands, USB chargers) follows the same UI pattern: a
  // JS array is the source of truth, rows are rebuilt into a DOM
  // container whenever the array changes, and each row's inputs mutate
  // their own instance object directly. This factory captures that
  // pattern once instead of repeating it per element — `rowHtml` builds
  // one row's inner markup from an instance + its index, `defaults`
  // supplies a new instance's starting values, and `extraFieldNames`
  // lists any select fields (besides the anchor field every list has)
  // that need special "changing this repaints the whole row" handling,
  // e.g. a variant/type selector.
  function createInstanceListManager({ containerId, addBtnId, itemLabel, defaults, rowHtml, onChange, onFieldChange }){
    // A new project starts with none of these instances — the user adds
    // only what they actually need, rather than getting one by default
    // and having to delete it. (Loading a saved project still restores
    // whatever list that project had, via setItems below.)
    let items = [];
    // onFieldChange (defaults to onChange if not given separately) is
    // what fires per keystroke on a row's own text/number field — kept
    // distinguishable from add/remove's onChange so callers can debounce
    // just the keystroke-driven path (see debouncedRender's own comment)
    // without also delaying the instant feedback of clicking + Add or
    // Remove, which aren't bursty and shouldn't feel laggy.
    const fieldChange = onFieldChange || onChange;

    function add(){
      items.push({ ...defaults(), dimensionsOn: true });
      renderList();
      onChange();
    }

    function remove(idx){
      items.splice(idx, 1);
      renderList();
      onChange();
    }
    function renderList(){
      const container = el(containerId);
      container.innerHTML = '';
      items.forEach((instance, idx) => {
        const row = document.createElement('div');
        row.className = 'instance-row';
        row.innerHTML = `
          <div class="instance-row-header">
            <span class="instance-row-title">${itemLabel} №${idx + 1}</span>
            <button type="button" class="instance-remove-btn" data-idx="${idx}">Удалить</button>
          </div>
          <div class="toggle-row">
            <span>Размерные линии</span>
            <label class="switch">
              <input type="checkbox" data-field="dimensionsOn" data-idx="${idx}">
              <span class="track"></span>
            </label>
          </div>
          ${rowHtml(instance, idx)}
        `;
        // Restore select values explicitly — setting them via the HTML
        // string's `value` attribute doesn't reliably select the right
        // <option> for dynamically-built markup, same as the charger's
        // original list logic. Checkboxes need the same explicit restore
        // treatment, since a `checked` attribute string in rowHtml can't
        // carry boolean state reliably either. dimensionsOn defaults to
        // true for instances saved before this field existed (undefined
        // !== false), so old projects keep showing their dimensions on
        // load rather than silently losing them.
        row.querySelectorAll('select[data-field]').forEach(sel => {
          sel.value = instance[sel.dataset.field];
        });
        row.querySelectorAll('input[type="checkbox"][data-field="dimensionsOn"]').forEach(cb => {
          cb.checked = instance.dimensionsOn !== false;
        });
        row.querySelectorAll('input[type="checkbox"][data-field]:not([data-field="dimensionsOn"])').forEach(cb => {
          cb.checked = !!instance[cb.dataset.field];
        });
        container.appendChild(row);
      });

      container.querySelectorAll('[data-field]:not(.anchor-grid-btn)').forEach(input => {
        const handler = () => {
          const idx = parseInt(input.dataset.idx, 10);
          const field = input.dataset.field;
          const isNumeric = input.type === 'number';
          const isCheckbox = input.type === 'checkbox';
          // A blank numeric field is kept as null (rather than coerced to
          // 0) so fields with a computed placeholder default — like the
          // USB charger's insetX — can fall back to that live default in
          // buildContours instead of silently becoming a real zero inset.
          items[idx][field] = isCheckbox ? input.checked
            : isNumeric ? (input.value === '' ? null : (parseFloat(input.value) || 0))
            : input.value;
          if (input.tagName === 'SELECT') {
            renderList(); // a select change may affect which fields this row shows (e.g. anchor axis visibility)
          }
          // Number/text fields fire on every keystroke — debounced, so
          // typing "150" into an inset field re-renders once after the
          // person pauses, not three times for "1", "15", "150". A select
          // or checkbox change is a single discrete click, not a typing
          // burst, so it stays instant.
          if (isNumeric || input.type === 'text') fieldChange();
          else onChange();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      // Anchor-grid buttons aren't <select>/<input> so they don't fire
      // input/change — handled separately via click. Same downstream
      // effect as a select change (anchor affects which X/Y fields this
      // row shows), so it re-renders the list the same way.
      container.querySelectorAll('.anchor-grid-btn[data-field]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx, 10);
          const field = btn.dataset.field;
          items[idx][field] = btn.dataset.value;
          renderList();
          onChange();
        });
      });
      container.querySelectorAll('.instance-remove-btn').forEach(btn => {
        btn.addEventListener('click', () => remove(parseInt(btn.dataset.idx, 10)));
      });
    }

    el(addBtnId).addEventListener('click', add);
    renderList();

    // setItems replaces the whole instance list wholesale (used by
    // project load) — each loaded instance is merged over a fresh
    // defaults() so a saved file from an older version of the app that's
    // missing a newer field still gets that field's current default
    // rather than ending up undefined. An empty saved list is kept
    // empty — the user may have deliberately removed every instance of
    // this element before saving, and that's exactly what a reload
    // should restore, not silently re-add one with default values.
    function setItems(newItems){
      items = (newItems || []).map(it => ({ ...defaults(), ...it }));
      renderList();
    }

    return { get items(){ return items; }, renderList, setItems };
  }

  // 3x3 grid layout order (row-major, matches how the buttons visually
  // read left-to-right/top-to-bottom) mapped to each cell's anchor value
  // and a title tooltip — same 9 anchors as Elements.ANCHOR_INSET, just
  // presented spatially instead of as text. The center cell doubles as
  // the tabletop's overall center reference.
  const ANCHOR_GRID_CELLS = [
    { anchor: 'topLeft',     title: 'Верхний левый угол' },
    { anchor: 'top',         title: 'Центр верхней стороны' },
    { anchor: 'topRight',    title: 'Верхний правый угол' },
    { anchor: 'left',        title: 'Центр левой стороны' },
    { anchor: 'center',      title: 'Центр столешницы' },
    { anchor: 'right',       title: 'Центр правой стороны' },
    { anchor: 'bottomLeft',  title: 'Нижний левый угол' },
    { anchor: 'bottom',      title: 'Центр нижней стороны' },
    { anchor: 'bottomRight', title: 'Нижний правый угол' },
  ];

  // Builds the anchor-grid markup for one instance row. Kept as a
  // function (not a static string like the old ANCHOR_OPTIONS_ALL) since
  // each button needs its own data-idx, and the active cell needs to be
  // marked up-front so it's correct even before renderList's restore step
  // runs (avoids a one-frame flash of no selection).
  function anchorGridHtml(idx, currentAnchor){
    const cells = ANCHOR_GRID_CELLS.map(({ anchor, title }) => `
      <button type="button" class="anchor-grid-btn${anchor === currentAnchor ? ' active' : ''}"
        data-field="anchor" data-idx="${idx}" data-value="${anchor}"
        title="${title}" aria-label="${title}"></button>
    `).join('');
    return `<div class="anchor-grid">${cells}</div>`;
  }

  // Builds the "Повернуть" (rotation, degrees, counter-clockwise) +
  // "Отразить" (mirror: none/horizontal/vertical) row shared by every
  // embeddable element — both fields sit side by side, matching the
  // anchor row's own two-column layout above, and both transforms are
  // applied around the element's own anchor/reference point (see each
  // element's own buildContours), not its visual center, so rotating or
  // mirroring never moves the point the person actually positioned.
  function transformFieldsHtml(idx, inst){
    return `
      <div class="row2">
        <div class="field">
          <label>Повернуть <span class="unit">°, CCW</span></label>
          <input type="number" data-field="rotation" data-idx="${idx}" value="${inst.rotation || 0}" step="1">
        </div>
        <div class="field">
          <label>Отразить</label>
          <select data-field="mirror" data-idx="${idx}">
            <option value="none">Нет</option>
            <option value="vertical">По вертикали</option>
            <option value="horizontal">По горизонтали</option>
          </select>
        </div>
      </div>`;
  }

  // Builds the anchor-picker + insetX/insetY row shared by every anchor-
  // based embeddable element (charger, outlet block, phone stand, tray,
  // pull-out stand). Both fields are always shown with the same "Отступ
  // по X"/"Отступ по Y" labels regardless of anchor — the two fields
  // don't change meaning depending on what they're near, only their
  // allowed range does: for a directional axis (corner-to-corner, or the
  // "inward" axis of an edge-center anchor) a negative value doesn't mean
  // anything so the field enforces min="0"; for a non-directional axis
  // (the along-the-edge axis of an edge-center anchor, or either axis of
  // 'center') the same field is a signed left/right or up/down shift, so
  // negative values are allowed. This mirrors Elements.ANCHOR_INSET's own
  // directionalX/directionalY exactly, so the UI's constraint always
  // matches what resolveInset actually does with the number. Also
  // includes the shared rotate/mirror row (transformFieldsHtml) below the
  // anchor+inset row, since every element using this shares that too.
  // Обновлённая функция insetFieldsHtml (добавлены плейсхолдеры для X и Y)
  function insetFieldsHtml(idx, inst) {
    const info = Elements.ANCHOR_INSET[inst.anchor] || Elements.ANCHOR_INSET.center;
    const minX = info.directionalX ? ' min="0"' : '';
    const minY = info.directionalY ? ' min="0"' : '';
    const xVal = inst.insetX != null ? inst.insetX : '';
    const yVal = inst.insetY != null ? inst.insetY : '';
    return `
      <div class="anchor-row">
        <div class="field">
          <label class="anchor-grid-label">Точка отсчёта</label>
          ${anchorGridHtml(idx, inst.anchor)}
        </div>
        <div class="field-col">
          <div class="field">
            <label>Отступ по X <span class="unit">мм</span></label>
            <input type="number" data-field="insetX" data-idx="${idx}" value="${xVal}"${minX} step="1">
          </div>
          <div class="field">
            <label>Отступ по Y <span class="unit">мм</span></label>
            <input type="number" data-field="insetY" data-idx="${idx}" value="${yVal}"${minY} step="1">
          </div>
        </div>
      </div>
      ${transformFieldsHtml(idx, inst)}`;
  }


  // Универсальный генератор менеджеров для встраиваемых элементов.
  // Убирает дублирование onChange, дефолтных трансформаций и шаблонов rowHtml.
  function createEmbeddableManager(cfg) {
    const { container, btn, label, typeSelector = null } = cfg;
    // Сохраняем дефолты как есть (они могут содержать функции)
    const rawDefaults = { rotation: 0, mirror: 'none', ...cfg.defaults };
    const showTypeSelector = typeSelector && typeSelector.options.length > 1;
    
    // Вспомогательная функция: если значение функция, вычисляем его
    const evalVal = (val, inst, p) => typeof val === 'function' ? val(inst, p) : val;

    const mgr = createInstanceListManager({
      containerId: container,
      addBtnId: btn,
      itemLabel: label,
      // При создании экземпляра всегда делаем inset поля null (пустыми)
      defaults: () => ({ ...rawDefaults, insetX: null, insetY: null }),
      onChange: () => render(),
      onFieldChange: () => debouncedRender(),
      rowHtml: (inst, idx) => {
        let html = '';
        if (showTypeSelector) {
          html += `
            <div class="field">
              <label>${typeSelector.label}</label>
              <select data-field="type" data-idx="${idx}">
                ${typeSelector.options.map(o => `<option value="${o.value}">${o.text}</option>`).join('')}
              </select>
            </div>`;
        }
        html += insetFieldsHtml(idx, inst);
        return html;
      }
    });

    // Обновляем серые подсказки в UI
    mgr.updatePlaceholders = (p) => {
      const containerEl = document.getElementById(container);
      if (!containerEl) return;
      
      containerEl.querySelectorAll('.instance-row').forEach((row, idx) => {
        const inst = mgr.items[idx];
        if (!inst) return;
        
        const defX = evalVal(rawDefaults.insetX, inst, p);
        const defY = evalVal(rawDefaults.insetY, inst, p);
        
        const inpX = row.querySelector('input[data-field="insetX"]');
        if (inpX && defX != null) inpX.placeholder = defX;
        
        const inpY = row.querySelector('input[data-field="insetY"]');
        if (inpY && defY != null) inpY.placeholder = defY;
      });
    };

    // Отдаём геометрии массив с уже вычисленными дефолтами
    mgr.resolveItems = (p) => mgr.items.map(it => ({
      ...it,
      insetX: it.insetX != null ? it.insetX : evalVal(rawDefaults.insetX, it, p),
      insetY: it.insetY != null ? it.insetY : evalVal(rawDefaults.insetY, it, p)
    }));

    return mgr;
  }


  // ---------- Instance-list managers ----------
  // Each repeatable element gets one manager built on the shared factory
  // above. insetFieldsHtml builds the anchor-picker + X/Y row shared by
  // every anchor-based element; only what genuinely differs between
  // elements (labels, default position, an optional type selector, or —
  // for the USB charger — a completely different one-axis shape) lives
  // in each manager below.

  const chargerMgr = createEmbeddableManager({ 
    container: 'chargerList', btn: 'addChargerBtn', label: 'Зарядка', 
    defaults: { anchor: 'topRight', insetX: 225, insetY: 200 } 
  });

  const outletBlockMgr = createEmbeddableManager({ 
    container: 'outletBlockList', btn: 'addOutletBlockBtn', label: 'Блок розеток', 
    defaults: { anchor: 'topLeft', insetX: 300, insetY: 115 } 
  });

  const phoneStandMgr = createEmbeddableManager({ 
    container: 'phoneStandList', btn: 'addPhoneStandBtn', label: 'Подставка для телефона', 
    defaults: { anchor: 'topRight', insetX: 225, insetY: 105 } 
  });

  // Tray: same anchor-based insetX/insetY as every other element above —
  // default anchor is the top edge, where insetY is the inward distance
  // from the top and insetX is a left/right shift from horizontal center
  // (see ANCHOR_INSET's own comment for why that's the same field rather
  // than a separate one). Only extra markup here is the type selector.
  const trayMgr = createEmbeddableManager({ 
    container: 'trayList', btn: 'addTrayBtn', label: 'Лоток', 
    defaults: { type: '60', anchor: 'top', insetX: 0, insetY: 115 },
    typeSelector: { label: 'Тип лотка', options: [{value:'60', text:'Лоток 60 см'}, {value:'80', text:'Лоток 80 см'}] }
  });

  // Pull-out stand: same treatment as the tray — default anchor is the
  // bottom edge, where insetY is the inward distance from the bottom
  // (auto-adjusted for the ergo-notch in the element itself.
  const pulloutMgr = createEmbeddableManager({ 
    container: 'pulloutList', btn: 'addPulloutBtn', label: 'Выдвижная подставка', 
    defaults: {
	  anchor: 'bottom',
	  insetX: 0,
	  insetY: (inst, p) => (p.notchOn ? p.notchH : 0), } 
  });

  // USB charger: only the horizontal position is configurable — its
  // vertical position is fixed by the part's own overhang design (see the
  // usbCharger element's own comment), so it doesn't fit insetFieldsHtml's
  // X/Y shape. insetX starts unset (null) so it follows the underframe's
  // own horizontal inset + 220mm by default (see the element's
  // buildContours), same "blank = follow the underframe" pattern as the
  // pult's insets — the placeholder shows the live computed default and
  // the field is only filled in once the user actually overrides it.
  const usbChargerMgr = createEmbeddableManager({ 
    container: 'usbChargerList', btn: 'addUsbChargerBtn', label: 'USB-зарядка', 
    defaults: { 
      anchor: 'bottomRight', 
      insetX: (inst, p) => (p.underframeInsetH || 0) + 220, 
      insetY: 0 
    } 
  });

  // Pult: type selector (Стандартный / Встраиваемый с USB) plus X — Y only
  // shows for Standard (embeddedUsb has no configurable vertical inset at
  // all, always flush with the bottom edge by design — see the element's
  // own comment). insetX starts unset (null), same "blank = follow the
  // underframe" pattern as the USB charger, since the default bonus
  // differs by type (110mm for Standard, 120mm for embeddedUsb — see
  // resolveInsets) and render() keeps each row's placeholder current.
  // Starts empty like every other instance list — historically Standard
  // always appeared as an automatic left+right pair, but now the person
  // adds each side as its own instance (e.g. bottomLeft + bottomRight),
  // same as any other element.
  const pultMgr = createEmbeddableManager({ 
    container: 'pultList', btn: 'addPultBtn', label: 'Пульт', 
    defaults: { 
      type: 'standard', 
      anchor: 'bottomRight', 
      insetX: (inst, p) => (p.underframeInsetH || 0) + (inst.type === 'embeddedUsb' ? 120 : 110),
      insetY: 0 
    },
    typeSelector: { 
      label: 'Тип пульта', 
      options: [{value:'standard', text:'Стандартный'}, {value:'embeddedUsb', text:'Встраиваемый с USB'}]
    }
  });

  // ---------- Fixed (non-list) inputs ----------
  const inputs = {
    orderNumber: el('orderNumber'),
    rectW: el('rectW'), rectH: el('rectH'), rectThickness: el('rectThickness'),
    rTop: el('rTop'), rBottom: el('rBottom'), rNotch: el('rNotch'),
    notchOn: el('notchOn'),
    notchH: el('notchH'), notchBottom: el('notchBottom'), notchTop: el('notchTop'),
    topNotchType: el('topNotchType'),
    topNotchWidth: el('topNotchWidth'), topNotchOffset: el('topNotchOffset'),
    rTopNotch: el('rTopNotch'),
    underframeType: el('underframeType'),
    underframeInsetH: el('underframeInsetH'), underframeInsetV: el('underframeInsetV'),
    dimensionsOn: el('dimensionsOn'),
  };
  const notchFieldsWrap = el('notchFields');
  const topNotchFieldsWrap = el('topNotchFields');
  const underframeFieldsWrap = el('underframeFields');
  const svg = el('stage');

  // Sanitizes the order number into a filesystem-safe filename — the
  // order number itself can contain characters a filename can't
  // (slashes, quotes, etc), so this only affects what gets written to
  // disk, not what's shown/edited in the field.
  function sanitizeFilename(raw){
    const cleaned = (raw || '').trim().replace(/[\\/:*?"<>|]+/g, '_');
    return cleaned || 'panel';
  }

  function readParams(){
    const underframeInsetH = parseFloat(inputs.underframeInsetH.value) || 0;
    
    // Сначала собираем базовые параметры
    const p = {
      W: parseFloat(inputs.rectW.value) || 0,
      H: parseFloat(inputs.rectH.value) || 0,
      thickness: parseFloat(inputs.rectThickness.value) || 0,
      rTop: parseFloat(inputs.rTop.value) || 0,
      rBottom: parseFloat(inputs.rBottom.value) || 0,
      rNotch: parseFloat(inputs.rNotch.value) || 0,
      notchOn: inputs.notchOn.checked,
      notchH: parseFloat(inputs.notchH.value) || 0,
      notchBottom: parseFloat(inputs.notchBottom.value) || 0,
      notchTop: parseFloat(inputs.notchTop.value) || 0,
      topNotchType: inputs.topNotchType.value,
      topNotchWidth: parseFloat(inputs.topNotchWidth.value) || 0,
      topNotchOffset: parseFloat(inputs.topNotchOffset.value) || 0,
      rTopNotch: parseFloat(inputs.rTopNotch.value) || 0,
      underframeType: inputs.underframeType.value,
      underframeInsetH: underframeInsetH,
      underframeInsetV: parseFloat(inputs.underframeInsetV.value) || 0,
      dimensionsOn: inputs.dimensionsOn.checked,
    };

    // Теперь, когда p готов, передаем его в resolveItems, 
    // чтобы менеджеры могли вычислить динамические дефолты (функции) 
    // и вернуть готовые массивы с числами для геометрии.
    p.chargers = chargerMgr.resolveItems(p);
    p.outletBlocks = outletBlockMgr.resolveItems(p);
    p.phoneStands = phoneStandMgr.resolveItems(p);
    p.trays = trayMgr.resolveItems(p);
    p.pullouts = pulloutMgr.resolveItems(p);
    p.usbChargers = usbChargerMgr.resolveItems(p);
    p.pults = pultMgr.resolveItems(p);

    return p;
  }

  function render(){
    // Включаем/выключаем блоки полей в UI
    notchFieldsWrap.classList.toggle('disabled', !inputs.notchOn.checked);
    topNotchFieldsWrap.classList.toggle('disabled', inputs.topNotchType.value === 'none');
    underframeFieldsWrap.classList.toggle('disabled', inputs.underframeType.value === 'none');

    const p = readParams();
    if (p.W <= 0 || p.H <= 0) return;

    // Обновляем серые подсказки (placeholders) для всех элементов
    chargerMgr.updatePlaceholders(p);
    outletBlockMgr.updatePlaceholders(p);
    phoneStandMgr.updatePlaceholders(p);
    trayMgr.updatePlaceholders(p);
    pulloutMgr.updatePlaceholders(p);
    usbChargerMgr.updatePlaceholders(p);
    pultMgr.updatePlaceholders(p);

    // Строим геометрию и размерные линии
    const entries = Drawing.build(p);
    const dims = Dimensions.build(p);
    const allEntries = [...entries, ...dims.entries];
    const svgMarkup = RenderSVG.build(allEntries, p.W, p.H, dims.texts);

    // Рассчитываем границы для viewBox (чтобы влезли размерные линии)
    const cosmeticPad = Math.max(p.W, p.H) * 0.08;
    const bounds = ExportSVG.computeBounds(allEntries, dims.texts, p.W, p.H);
    const minX = Math.min(bounds.minX, -cosmeticPad);
    const minY = Math.min(bounds.minY, -cosmeticPad);
    const maxX = Math.max(bounds.maxX, p.W + cosmeticPad);
    const maxY = Math.max(bounds.maxY, p.H + cosmeticPad);
    const vbX = minX, vbW = maxX - minX;
    const svgMinY = p.H - maxY, vbH = maxY - minY;
    svg.setAttribute('viewBox', `${vbX} ${svgMinY} ${vbW} ${vbH}`);
    svg.innerHTML = svgMarkup;
  }

  // debouncedRender — same render(), just delayed by DEBOUNCE_MS after the
  // last call. Every keystroke in a number/text field fires 'input', and
  // render() rebuilds all geometry + re-serializes the whole SVG via
  // innerHTML on every call — fine for a single call, wasteful when 5+
  // keystrokes land within a few dozen milliseconds while someone's
  // actively typing (e.g. widening a field from "50" to "150"). This
  // collapses a fast burst of calls into just the last one. Only wired to
  // user-input-triggered paths (see below); the very first render() call
  // and the one after loading a saved project stay direct/instant, since
  // those aren't bursts and a delay there would just look like lag on
  // page load or after picking a file.
  const DEBOUNCE_MS = 120;
  let debounceTimer = null;
  function debouncedRender(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, DEBOUNCE_MS);
  }

  function exportDxf(){
    const p = readParams();
    if (p.W <= 0 || p.H <= 0) { alert('Укажите положительные ширину и высоту.'); return; }
    const entries = Drawing.build(p);
    const dims = Dimensions.build(p);
    ExportDXF.downloadAs([...entries, ...dims.entries], sanitizeFilename(inputs.orderNumber.value), dims.texts);
  }

  function exportSvg(){
    const p = readParams();
    if (p.W <= 0 || p.H <= 0) { alert('Укажите положительные ширину и высоту.'); return; }
    const entries = Drawing.build(p);
    const dims = Dimensions.build(p);
    ExportSVG.downloadAs([...entries, ...dims.entries], p.W, p.H, sanitizeFilename(inputs.orderNumber.value), dims.texts);
  }

  async function exportPng(){
    const p = readParams();
    if (p.W <= 0 || p.H <= 0) { alert('Укажите положительные ширину и высоту.'); return; }
    const entries = Drawing.build(p);
    const dims = Dimensions.build(p);
    const mainBtn = el('exportMainBtn');
    const originalLabel = mainBtn.textContent;
    mainBtn.disabled = true;
    mainBtn.textContent = 'Рендеринг…';
    try {
      await ExportPNG.downloadAs([...entries, ...dims.entries], p.W, p.H, sanitizeFilename(inputs.orderNumber.value), dims.texts);
    } catch (err) {
      alert('Не удалось экспортировать PNG: ' + err.message);
    } finally {
      mainBtn.disabled = false;
      mainBtn.textContent = originalLabel;
    }
  }

  // The split-button's main action always exports PNG (the common case);
  // DXF/SVG live in the dropdown next to it, opened via the chevron.
  // EXPORT_FORMATS keys off data-format so both the main button and each
  // dropdown entry can share one dispatch function instead of three
  // separate listeners repeating the same lookup.
  const EXPORT_FORMATS = { dxf: exportDxf, svg: exportSvg, png: exportPng };

  function runExport(format){
    closeExportMenu();
    const fn = EXPORT_FORMATS[format];
    if (fn) fn();
  }

  function openExportMenu(){
    el('exportMenu').classList.add('open');
    el('exportMenuToggle').setAttribute('aria-expanded', 'true');
  }
  function closeExportMenu(){
    el('exportMenu').classList.remove('open');
    el('exportMenuToggle').setAttribute('aria-expanded', 'false');
  }
  function toggleExportMenu(){
    if (el('exportMenu').classList.contains('open')) closeExportMenu();
    else openExportMenu();
  }

  // ---------- Project save/load ----------
  // Serializes every raw form field plus each instance list's raw items —
  // i.e. exactly what the user typed/selected, not the resolved geometry
  // (positions, contours) that's derived from it — so a loaded project
  // re-derives its drawing the same way a freshly-typed one would,
  // including picking up any live defaults (underframe-linked insets etc)
  // that were left blank on purpose.
  const PROJECT_FILE_VERSION = 1;
  const SIMPLE_INPUT_IDS = [
    'orderNumber', 'rectW', 'rectH', 'rectThickness', 'rTop', 'rBottom', 'rNotch',
    'notchOn', 'notchH', 'notchBottom', 'notchTop',
    'topNotchType', 'topNotchWidth', 'topNotchOffset', 'rTopNotch',
    'underframeType', 'underframeInsetH', 'underframeInsetV',
    'dimensionsOn',
  ];

  function buildProjectData(){
    const values = {};
    for (const id of SIMPLE_INPUT_IDS) {
      const input = el(id);
      values[id] = input.type === 'checkbox' ? input.checked : input.value;
    }
    return {
      fileType: 'tabletop-layout-project',
      version: PROJECT_FILE_VERSION,
      values,
      instances: {
        chargers: chargerMgr.items,
        outletBlocks: outletBlockMgr.items,
        phoneStands: phoneStandMgr.items,
        trays: trayMgr.items,
        pullouts: pulloutMgr.items,
        usbChargers: usbChargerMgr.items,
        pults: pultMgr.items,
      },
    };
  }

  function saveProject(){
    const data = buildProjectData();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sanitizeFilename(inputs.orderNumber.value) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function applyProjectData(data){
    if (!data || data.fileType !== 'tabletop-layout-project' || !data.values) {
      throw new Error('Файл не похож на проект столешницы.');
    }
    for (const id of SIMPLE_INPUT_IDS) {
      if (!(id in data.values)) continue;
      const input = el(id);
      const val = data.values[id];
      if (input.type === 'checkbox') input.checked = !!val;
      else input.value = val === null || val === undefined ? '' : val;
    }
    const inst = data.instances || {};
    chargerMgr.setItems(inst.chargers);
    outletBlockMgr.setItems(inst.outletBlocks);
    phoneStandMgr.setItems(inst.phoneStands);
    trayMgr.setItems(inst.trays);
    pulloutMgr.setItems(inst.pullouts);
    usbChargerMgr.setItems(inst.usbChargers);
    pultMgr.setItems(inst.pults);
    render();
  }

  function loadProject(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        applyProjectData(data);
      } catch (err) {
        alert('Не удалось загрузить проект: ' + err.message);
      }
    };
    reader.onerror = () => alert('Не удалось прочитать файл.');
    reader.readAsText(file);
  }

  Object.values(inputs).forEach(inp => {
    inp.addEventListener('input', debouncedRender);
    inp.addEventListener('change', debouncedRender);
  });
  el('exportMainBtn').addEventListener('click', () => runExport('png'));
  el('exportMenuToggle').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleExportMenu();
  });
  el('exportMenu').querySelectorAll('button[data-format]').forEach(btn => {
    btn.addEventListener('click', () => runExport(btn.dataset.format));
  });
  document.addEventListener('click', (e) => {
    if (!el('exportSplit').contains(e.target)) closeExportMenu();
  });
  el('saveProjectBtn').addEventListener('click', saveProject);
  el('loadProjectBtn').addEventListener('click', () => el('loadProjectInput').click());
  el('loadProjectInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) loadProject(file);
    e.target.value = ''; // allow re-selecting the same file later
  });

  render();
})();
})();
</script>
</body>
</html>
