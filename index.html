<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DSK Editor</title>
<!-- Decimal.js: used only at the final coordinate-rounding step before
     writing DXF/SVG output, to clean up floating-point noise (e.g.
     29.999999999999996) accumulated across many additions/subtractions of
     insets and offsets, so exported files always show clean millimeter
     values. Not used for the geometry math itself (fillets/arcs rely on
     Math.sin/cos/atan, which Decimal.js can't improve). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<style>
  :root{
    --bg: #14181c;
    --panel: #1b2126;
    --panel-2: #20272d;
    --line: #2c363d;
    --grid: #232c32;
    --ink: #dfe6ea;
    --ink-dim: #7d8b93;
    --accent: #ff8a3d;
    --accent-dim: #8a4d24;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, Segoe UI, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:grid;
    grid-template-columns: 1fr 360px;
    height:100vh;
    min-height:480px;
  }
  @media (max-width: 820px){
    #app{ grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
  }

  /* ---------- Preview pane ---------- */
  #preview{
    position:relative;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px,
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-right:1px solid var(--line);
  }
  #preview .label{
    position:absolute; top:16px; left:20px;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em;
    color:var(--ink-dim); text-transform:uppercase;
  }
  #preview .dims{
    position:absolute; bottom:16px; left:20px;
    font-family:var(--mono); font-size:12px; color:var(--ink-dim);
    line-height:1.6;
  }
  #preview .dims b{ color:var(--ink); font-weight:600; }
  svg#stage{ max-width:92%; max-height:82%; overflow:visible; }
  .layer-outline{
    fill: rgba(255,138,61,0.06);
    stroke: var(--accent);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }
  .layer-underframe{
    fill: none;
    stroke: #4d8ff0;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }
  .layer-underframe-holes{
    fill: none;
    stroke: #b06fe0;
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  .layer-elements{
    fill: rgba(76,201,124,0.08);
    stroke: #4cc97c;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }
  .layer-elements-back{
    fill: rgba(77,207,224,0.08);
    stroke: #4dcfe0;
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    vector-effect: non-scaling-stroke;
  }
  .layer-dimensions{
    fill: #e05a5a;
    stroke: #e05a5a;
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  /* A contour whose layer isn't in Layers.registry — see RenderSVG's own
     comment. Bright red and animated specifically so it can't be mistaken
     for a normal (if unfamiliar) layer color; this is meant to look like
     an error, not just a new style. Preview-only, per the person — export
     (DXF/SVG/PNG) still writes the contour out normally, just without a
     registered layer name/color to draw from. */
  .layer-unknown{
    fill: rgba(255,0,0,0.15);
    stroke: #ff0000;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
    animation: layer-unknown-blink 1s step-start infinite;
  }
  @keyframes layer-unknown-blink{
    50% { opacity: 0.25; }
  }
  .dim-line{ stroke: var(--ink-dim); stroke-width:1; vector-effect:non-scaling-stroke; }
  .dim-text{ fill: #e05a5a; stroke: none; font-family: var(--mono); font-size: 20px; font-weight: 600; }

  /* ---------- Controls pane ---------- */
  #controls{
    background:var(--panel);
    overflow-y:auto;
    padding:22px 22px 100px;
  }
  #controls h1{
    font-family:var(--mono);
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 4px;
  }
  #controls .sub{
    font-size:12px; color:var(--ink-dim); margin-bottom:22px;
  }
  fieldset{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px 16px;
    margin:0 0 16px;
    background:var(--panel-2);
  }
  legend{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
    padding:0 6px;
  }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12.5px; color:var(--ink); margin-bottom:5px;
  }
  .field label .unit{ color:var(--ink-dim); font-family:var(--mono); font-size:11px; }
  .field input[type=number]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    padding:7px 9px;
  }
  .instance-row{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px 14px;
    margin-bottom:10px;
    position:relative;
  }
  .instance-row-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px;
  }
  .instance-row-title{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-dim);
  }
  .instance-remove-btn{
    background:none; border:none; color:var(--ink-dim);
    font-family:var(--mono); font-size:11px; cursor:pointer;
    padding:2px 6px; border-radius:4px;
  }
  .instance-remove-btn:hover{ color:#e05a5a; background:rgba(224,90,90,0.1); }

  /* Anchor picker: a 3x3 grid mirroring the tabletop's own corners/edges/
     center, replacing a 9-item text <select> — clicking the square that
     visually matches the desired reference point is far more direct than
     reading "Верхний правый угол" in a dropdown list. The grid's own
     border represents the tabletop; each button's position within it IS
     its meaning, so no separate label per button is needed beyond a
     small icon showing corner/edge/center. */
  .anchor-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:3px;
    width:84px;
    height:84px;
    padding:4px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
  }
  .anchor-grid-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    cursor:pointer;
    padding:0;
    display:flex; align-items:center; justify-content:center;
    transition:background .1s, border-color .1s;
  }
  .anchor-grid-btn:hover{ border-color:var(--accent); }
  .anchor-grid-btn::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
    background:var(--ink-dim);
  }
  .anchor-grid-btn.active{ background:var(--accent-dim); border-color:var(--accent); }
  .anchor-grid-btn.active::before{ background:var(--accent); }
  .anchor-grid-label{
    font-size:12.5px; color:var(--ink); margin-bottom:6px; display:block;
  }

  /* Anchor row: the anchor-grid picker on the left, its X/Y inset fields
     stacked in a column on the right — same two-column layout for every
     embeddable element, so the controls don't jump around between
     elements or reflow their fields in/out as the anchor changes (insets
     are always shown now, per the person's request, rather than hidden
     for anchors where a given axis doesn't apply). */
  .anchor-row{ display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; }
  .anchor-row .anchor-grid-label{ margin-bottom:8px; }
  .field-col{ flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .field-col .field{ margin:0; }

  .btn-add{
    width:100%;
    background:transparent;
    color:var(--accent);
    border:1px dashed var(--accent-dim);
    border-radius:6px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.05em;
    padding:10px 0;
    cursor:pointer;
    margin-top:2px;
  }
  .btn-add:hover{ background:rgba(255,138,61,0.08); border-color:var(--accent); }
  .field input[type=number]:focus{
    outline:none; border-color:var(--accent);
  }
  .field input[type=range]{
    width:100%; accent-color:var(--accent);
  }
  .field input[type=text]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    padding:8px 9px;
  }
  .field select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    padding:8px 9px;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%237d8b93'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
  }
  .field select:focus{
    outline:none; border-color:var(--accent);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 4px;
  }
  .toggle-row span{ font-size:12.5px; color:var(--ink); }
  .switch{
    position:relative; width:38px; height:21px; flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .track{
    position:absolute; inset:0; background:var(--line);
    border-radius:20px; transition:.15s; cursor:pointer;
  }
  .switch .track::before{
    content:''; position:absolute; width:15px; height:15px;
    left:3px; top:3px; background:var(--ink-dim);
    border-radius:50%; transition:.15s;
  }
  .switch input:checked + .track{ background:var(--accent-dim); }
  .switch input:checked + .track::before{
    transform:translateX(17px); background:var(--accent);
  }

  #notchFields{ transition:opacity .15s; }
  #notchFields.disabled, #topNotchFields.disabled{ opacity:.35; pointer-events:none; }

  .btn-secondary{
    width:100%;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:600;
    padding:12px 0;
    cursor:pointer;
  }
  .btn-secondary:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-secondary:active{ transform:translateY(1px); }

  /* Export split-button: main action (PNG by default) + a narrow chevron
     that opens a dropdown for the other formats (DXF/SVG). Reuses
     #exportBtn's look but as two adjacent pieces instead of one block,
     so the dropdown trigger doesn't need its own separate visual style. */
  #exportSplit{ display:flex; margin-top:6px; position:relative; }
  #exportMainBtn{
    flex:1;
    background:var(--accent);
    color:#1a1108;
    border:none;
    border-radius:6px 0 0 6px;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:600;
    padding:12px 0;
    cursor:pointer;
  }
  #exportMainBtn:hover{ background:#ffa25f; }
  #exportMainBtn:active{ transform:translateY(1px); }
  #exportMenuToggle{
    width:34px;
    background:var(--accent);
    color:#1a1108;
    border:none;
    border-left:1px solid rgba(0,0,0,.2);
    border-radius:0 6px 6px 0;
    cursor:pointer;
    font-size:10px;
    display:flex; align-items:center; justify-content:center;
  }
  #exportMenuToggle:hover{ background:#ffa25f; }
  #exportMenu{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    right:0;
    left:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    z-index:10;
  }
  #exportMenu.open{ display:block; }
  #exportMenu button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--ink);
    font-family:var(--mono);
    font-size:12px;
    padding:10px 12px;
    cursor:pointer;
  }
  #exportMenu button:hover{ background:var(--panel); color:var(--accent); }

  /* Save/Load: compact icon buttons side by side, with a native tooltip
     via title="" rather than a full label, per the request for a more
     compact icon-based treatment than the old full-width text buttons. */
  #projectRow{ display:flex; gap:8px; margin-top:8px; }
  .btn-icon{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 0;
    cursor:pointer;
  }
  .btn-icon:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-icon:active{ transform:translateY(1px); }
  .btn-icon svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; }
</style>
</head>
<body>
<div id="app">

  <div id="preview">
    <svg id="stage" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div id="controls">
    <fieldset id="orderHeader">
      <legend>Проект</legend>
      <div class="field" style="margin-bottom:10px;">
        <label>Номер заказа</label>
        <input type="text" id="orderNumber" value="DSK">
      </div>
      <div class="toggle-row" style="margin-bottom:12px;">
        <span>Показать размерные линии</span>
        <label class="switch">
          <input type="checkbox" id="dimensionsOn" checked>
          <span class="track"></span>
        </label>
      </div>
      <div id="exportSplit">
        <button id="exportMainBtn">Экспортировать PNG</button>
        <button id="exportMenuToggle" type="button" title="Другие форматы" aria-haspopup="true" aria-expanded="false">▾</button>
        <div id="exportMenu" role="menu">
          <button type="button" data-format="dxf" role="menuitem">Экспортировать DXF</button>
          <button type="button" data-format="svg" role="menuitem">Экспортировать SVG</button>
          <button type="button" data-format="png" role="menuitem">Экспортировать PNG</button>
        </div>
      </div>
      <div id="projectRow">
        <button id="saveProjectBtn" class="btn-icon" type="button" title="Сохранить проект в JSON">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
          <span>Сохранить</span>
        </button>
        <button id="loadProjectBtn" class="btn-icon" type="button" title="Загрузить проект из JSON">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/></svg>
          <span>Загрузить</span>
        </button>
      </div>
      <input type="file" id="loadProjectInput" accept="application/json,.json" style="display:none;">
    </fieldset>

    <fieldset>
      <legend>Столешница</legend>
      <div class="row2">
        <div class="field">
          <label>Ширина <span class="unit">мм</span></label>
          <input type="number" id="rectW" value="1500" min="1" step="1">
        </div>
        <div class="field">
          <label>Высота <span class="unit">мм</span></label>
          <input type="number" id="rectH" value="700" min="1" step="1">
        </div>
      </div>
      <div class="field">
        <label>Толщина <span class="unit">мм</span></label>
        <input type="number" id="rectThickness" value="30" min="1" step="1">
      </div>
	  <div class="row2">
        <div class="field">
          <label>Скругление верх<span class="unit">мм</span></label>
          <input type="number" id="rTop" value="5" min="0" step="1">
        </div>
        <div class="field">
          <label>Скругление низ<span class="unit">мм</span></label>
          <input type="number" id="rBottom" value="50" min="0" step="1">
        </div>
	  </div>
    </fieldset>

    <fieldset>
      <legend>Эргономический вырез</legend>
      <div class="toggle-row">
        <span>Добавить вырез</span>
        <label class="switch">
          <input type="checkbox" id="notchOn" checked>
          <span class="track"></span>
        </label>
      </div>
      <div id="notchFields" style="margin-top:12px;">
        <div class="row2">
          <div class="field">
            <label>Ширина низа <span class="unit">мм</span></label>
            <input type="number" id="notchBottom" value="750" min="0" step="1">
          </div>
          <div class="field">
            <label>Ширина верха <span class="unit">мм</span></label>
            <input type="number" id="notchTop" value="600" min="0" step="1">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Высота выреза <span class="unit">мм</span></label>
            <input type="number" id="notchH" value="75" min="0" step="1">
          </div>
          <div class="field">
            <label>Скругление углов <span class="unit">мм</span></label>
            <input type="number" id="rNotch" value="50" min="0" step="1">
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Вырез для проводов</legend>
      <div class="field">
        <label>Тип выреза</label>
        <select id="topNotchType">
          <option value="none">Нет выреза</option>
          <option value="tslot">Т-образный</option>
          <option value="rect">Прямоугольный</option>
        </select>
      </div>
      <div id="topNotchFields" style="margin-top:12px;">
        <div class="row2">
          <div class="field">
            <label>Ширина выреза <span class="unit">мм</span></label>
            <input type="number" id="topNotchWidth" value="300" min="0" step="1">
          </div>
          <div class="field">
            <label>Смещение <span class="unit">мм</span></label>
            <input type="number" id="topNotchOffset" value="0" step="1">
          </div>
        </div>
        <div class="field">
          <label>Скругление углов <span class="unit">мм</span></label>
          <input type="number" id="rTopNotch" value="5" min="0" step="1">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Подстолье</legend>
      <div class="field">
        <label>Тип подстолья</label>
        <select id="underframeType">
          <option value="none">Нет подстолья</option>
          <option value="60" selected>Подстолье 60</option>
          <option value="70">Подстолье 70</option>
        </select>
      </div>
      <div id="underframeFields" style="margin-top:12px;">
        <div class="row2">
          <div class="field">
            <label>Отступ <span class="unit">мм</span></label>
            <input type="number" id="underframeInsetH" value="50" min="0" step="1">
          </div>
          <div class="field">
            <label>Смещение <span class="unit">мм</span></label>
            <input type="number" id="underframeInsetV" value="0" step="1">
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Пульты управления</legend>
      <div id="pultList"></div>
      <button type="button" id="addPultBtn" class="btn-add">+ Добавить пульт</button>
    </fieldset>

    <fieldset>
      <legend>Беспроводные зарядки</legend>
      <div id="chargerList"></div>
      <button type="button" id="addChargerBtn" class="btn-add">+ Добавить зарядку</button>
    </fieldset>

    <fieldset>
      <legend>Блоки розеток</legend>
      <div id="outletBlockList"></div>
      <button type="button" id="addOutletBlockBtn" class="btn-add">+ Добавить блок розеток</button>
    </fieldset>

    <fieldset>
      <legend>Подставки для телефона</legend>
      <div id="phoneStandList"></div>
      <button type="button" id="addPhoneStandBtn" class="btn-add">+ Добавить подставку</button>
    </fieldset>

    <fieldset>
      <legend>Лотки для сетевого фильтра</legend>
      <div id="trayList"></div>
      <button type="button" id="addTrayBtn" class="btn-add">+ Добавить лоток</button>
    </fieldset>

    <fieldset>
      <legend>Выдвижные подставки</legend>
      <div id="pulloutList"></div>
      <button type="button" id="addPulloutBtn" class="btn-add">+ Добавить подставку</button>
    </fieldset>

    <fieldset>
      <legend>Торцевые USB-зарядки</legend>
      <div id="usbChargerList"></div>
      <button type="button" id="addUsbChargerBtn" class="btn-add">+ Добавить USB-зарядку</button>
    </fieldset>

  </div>

</div>

<script>
(function(){

// ============================================================================
// Geo — pure 2D geometry helpers. No knowledge of "tabletop", "notch", DXF,
// or the DOM. Everything here operates on plain {x,y} points and on
// "rounded contours": arrays of {x, y, bulge} vertices, where `bulge` is the
// DXF-style curvature applying to the segment from that vertex to the next
// (0 = straight line; nonzero = arc, magnitude = tan(sweepAngle/4), sign
// positive for CCW). This convention is shared by DXF's LWPOLYLINE/POLYLINE
// bulge field and is what the rest of the app (SVG preview, DXF export)
// consumes, so every element builder ultimately produces this shape.
// ============================================================================
const Geo = (() => {

  function dist(a, b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }

  // Rounds a coordinate to `decimals` places using Decimal.js rather than
  // plain Number rounding, specifically for the moment a value is about to
  // be written into an output file (DXF/SVG). Plain floating-point math
  // accumulates small binary-representation errors across the many
  // additions/subtractions involved in placing an element (inset + offset
  // - half-width, etc.), so a value that's conceptually exactly 30 can
  // arrive here as 29.999999999999996; Decimal.js's decimal (not binary)
  // arithmetic cleans that up to a true "30" before export, so CAD/CAM
  // tools reading the file see round millimeter values instead of noise.
  // Falls back to plain rounding if Decimal.js failed to load (e.g. no
  // network on first load with the CDN script) so export still works,
  // just without the extra cleanup.
  function cleanRound(value, decimals = 4){
    if (typeof Decimal === 'undefined') {
      const f = Math.pow(10, decimals);
      return Math.round(value * f) / f;
    }
    return new Decimal(value).toDecimalPlaces(decimals).toNumber();
  }

  // Shifts every vertex of a contour by (dx, dy), keeping each vertex's
  // bulge untouched — bulge describes curvature relative to the segment's
  // own two endpoints, so a plain translation never needs to touch it.
  // Used by every element's buildContours to place its local-coordinate
  // shape at its resolved world position.
  function translate(verts, dx, dy){
    return verts.map(v => ({ x: v.x + dx, y: v.y + dy, bulge: v.bulge }));
  }

  // Rotates a contour counter-clockwise by `degrees` around a given pivot
  // (defaults to the local origin). A pure rotation is a rigid motion —
  // it never changes which side of an edge is "inside" a curve, so bulge
  // (which only encodes curvature relative to the edge's own direction,
  // not any absolute axis) needs no sign correction here, unlike a
  // mirror. Used for the user-facing "Повернуть" control on embeddable
  // elements — applied to local coordinates, before Geo.translate places
  // the shape at its resolved world position, so the pivot is whatever
  // point the caller's local (0,0) represents for that element (its own
  // anchor point, not necessarily its visual center).
  function rotate(verts, degrees, pivot = { x: 0, y: 0 }){
    if (!degrees) return verts;
    const rad = degrees * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    return verts.map(v => {
      const dx = v.x - pivot.x, dy = v.y - pivot.y;
      return {
        x: pivot.x + dx * cos - dy * sin,
        y: pivot.y + dx * sin + dy * cos,
        bulge: v.bulge,
      };
    });
  }

  // Mirrors a contour across a horizontal or vertical line through a
  // given pivot (defaults to the local origin) — 'horizontal' flips
  // vertically (reflects y, i.e. the shape ends up mirrored across a
  // horizontal line, matching how "Отразить: по горизонтали" reads as
  // "flip across the horizontal axis" for other CAD/vector tools), while
  // 'vertical' flips horizontally (reflects x). Any reflection reverses a
  // contour's winding (CW <-> CCW) and each bulge's effective curvature
  // side, so this always runs the result back through reverseContour to
  // restore consistent winding — same correction every other mirroring
  // element in this app already applies (see e.g. the underframe/pult's
  // own mirrorX, or the usbCharger's own mirrorY).
  function mirror(verts, axisKind, pivot = { x: 0, y: 0 }){
    if (!axisKind || axisKind === 'none') return verts;
    const flipped = verts.map(v => {
      if (axisKind === 'horizontal') {
        return { x: v.x, y: 2 * pivot.y - v.y, bulge: -v.bulge };
      }
      return { x: 2 * pivot.x - v.x, y: v.y, bulge: -v.bulge };
    });
    return reverseContour(flipped);
  }

  // Shoelace formula: positive for a counter-clockwise contour, negative
  // for clockwise. Used to check/enforce winding direction before writing
  // a contour out (DXF and the fill-rule-sensitive parts of SVG both care
  // about winding).
  function signedArea(verts){
    let a = 0;
    const n = verts.length;
    for (let i = 0; i < n; i++){
      const p1 = verts[i], p2 = verts[(i + 1) % n];
      a += p1.x * p2.y - p2.x * p1.y;
    }
    return a / 2;
  }

  // Reverses a contour's winding direction (CW <-> CCW). Since `bulge` on
  // vertex i describes the arc for the edge i -> i+1, reversing point
  // order also shifts which vertex each bulge belongs to and flips its
  // sign relative to the new edge direction — both handled here, not just
  // the point order, so the resulting contour still draws the same arcs.
  function reverseContour(verts){
    const n = verts.length;
    const revPoints = [...verts].reverse().map(v => ({ x: v.x, y: v.y }));
    const out = [];
    for (let k = 0; k < n; k++){
      const origIdx = (n - 2 - k + n) % n;
      out.push({ x: revPoints[k].x, y: revPoints[k].y, bulge: -verts[origIdx].bulge });
    }
    return out;
  }

  // Shifts every vertex of a contour by (dx, dy), keeping each vertex's
  // bulge untouched — bulge describes curvature relative to the segment's
  // own two endpoints, so a plain translation never needs to touch it.
  // Used by every element's buildContours to place its local-coordinate
  // shape at its resolved world position.

  // Shoelace formula: positive for a counter-clockwise contour, negative
  // for clockwise. Used to check/enforce winding direction before writing
  // a contour out (DXF and the fill-rule-sensitive parts of SVG both care
  // about winding).

  // Reverses a contour's winding direction (CW <-> CCW). Since `bulge` on
  // vertex i describes the arc for the edge i -> i+1, reversing point
  // order also shifts which vertex each bulge belongs to and flips its
  // sign relative to the new edge direction — both handled here, not just
  // the point order, so the resulting contour still draws the same arcs.

  // Given the corner of a polygon (prev -> corner -> next) and a fillet
  // radius, returns [tangentIn, tangentOut, bulge]:
  //   tangentIn / tangentOut: where the fillet arc touches the two edges
  //   bulge: curvature for the arc FROM tangentIn TO tangentOut
  // If r<=0 or the corner is degenerate, returns the corner itself twice
  // with bulge 0 (no rounding) so callers can treat every corner uniformly.
  function filletCorner(pIn, corner, pOut, r){
    if (r <= 0) return [corner, corner, 0];
    const v1 = [pIn[0]-corner[0], pIn[1]-corner[1]];
    const v2 = [pOut[0]-corner[0], pOut[1]-corner[1]];
    const len1 = Math.hypot(v1[0], v1[1]);
    const len2 = Math.hypot(v2[0], v2[1]);
    if (len1 < 1e-9 || len2 < 1e-9) return [corner, corner, 0];
    const u1 = [v1[0]/len1, v1[1]/len1];
    const u2 = [v2[0]/len2, v2[1]/len2];
    let dot = u1[0]*u2[0] + u1[1]*u2[1];
    dot = Math.max(-1, Math.min(1, dot));
    const theta = Math.acos(dot);
    if (theta < 1e-6) return [corner, corner, 0];
    let tlen = r / Math.tan(theta/2);
    // Clamp so the fillet never overruns the available edge length
    // (prevents self-intersecting geometry on very tight params).
    const maxLen = Math.min(len1, len2) * 0.999;
    tlen = Math.min(tlen, maxLen);
    const t1 = [corner[0]+u1[0]*tlen, corner[1]+u1[1]*tlen];
    const t2 = [corner[0]+u2[0]*tlen, corner[1]+u2[1]*tlen];
    const cross = u1[0]*u2[1] - u1[1]*u2[0];
    const sweep = Math.PI - theta;
    const bmag = Math.tan(sweep/4);
    const bulge = cross < 0 ? bmag : -bmag;
    return [t1, t2, bulge];
  }

  // Turns a list of {pt: [x,y], r: radius} corners (in order, forming a
  // closed polygon) into a rounded contour: an array of {x, y, bulge}
  // vertices, two per corner (tangent-in, tangent-out), ready for SVG
  // rendering or DXF tessellation.
  function roundedPolygon(corners){
    const n = corners.length;
    const verts = [];
    for (let i = 0; i < n; i++){
      const prev = corners[(i - 1 + n) % n].pt;
      const cur = corners[i].pt;
      const next = corners[(i + 1) % n].pt;
      const r = corners[i].r;
      const [tIn, tOut, bulge] = filletCorner(prev, cur, next, r);
      // bulge describes the arc FROM this vertex TO the next one in the
      // list. The arc runs from tIn to tOut (the fillet itself), so the
      // bulge goes on tIn; tOut then starts a straight edge to the next
      // corner's tIn, so it carries bulge 0.
      verts.push({ x: tIn[0], y: tIn[1], bulge: bulge });
      verts.push({ x: tOut[0], y: tOut[1], bulge: 0 });
    }
    return verts;
  }

  // Reconstructs the radius of a bulge arc from its chord length.
  function bulgeRadius(p1, p2, bulge){
    const d = dist(p1, p2);
    return Math.abs(d * (1 + bulge*bulge) / (4 * Math.abs(bulge)));
  }

  // Converts one rounded contour into an SVG path `d` string. `flipY`
  // mirrors CAD (Y-up) coordinates into SVG (Y-down) display space around
  // height H; when flipping, the arc sweep-flag must also flip to keep the
  // visual direction consistent (a CCW arc in Y-up becomes CW on screen).
  function contourToSvgPath(verts, flipY, H, closed = true){
    const y = v => flipY ? (H - v) : v;
    let d = `M ${verts[0].x} ${y(verts[0].y)} `;
    const n = verts.length;
    const segCount = closed ? n : n - 1;
    for (let i = 0; i < segCount; i++){
      const cur = verts[i];
      const next = verts[(i+1) % n];
      if (Math.abs(cur.bulge) < 1e-9){
        d += `L ${next.x} ${y(next.y)} `;
      } else {
        const r = bulgeRadius([cur.x, cur.y], [next.x, next.y], cur.bulge);
        const sweepAngle = Math.abs(4 * Math.atan(cur.bulge));
        const largeArc = sweepAngle > Math.PI ? 1 : 0;
        let sweepFlag = cur.bulge > 0 ? 1 : 0;
        if (flipY) sweepFlag = 1 - sweepFlag;
        d += `A ${r} ${r} 0 ${largeArc} ${sweepFlag} ${next.x} ${y(next.y)} `;
      }
    }
    if (closed) d += 'Z';
    return d;
  }

  // Converts one rounded contour into a plain polyline (list of {x,y}
  // points, no bulge) by sampling each arc into short straight segments.
  // Used only for DXF export: some DXF readers handle bulge on the classic
  // POLYLINE/VERTEX entity inconsistently (a few drop or misread the 42
  // group), which can turn a small fillet into a visible kink. Tessellating
  // before export guarantees the file looks identical in every reader; the
  // on-screen preview still uses true arcs via contourToSvgPath above.
  function tessellateContour(verts, segmentsPerFullCircle, closed = true){
    const out = [];
    const n = verts.length;
    const segCount = closed ? n : n - 1;
    for (let i = 0; i < segCount; i++){
      const cur = verts[i];
      const next = verts[(i + 1) % n];
      out.push({ x: cur.x, y: cur.y });
      if (Math.abs(cur.bulge) < 1e-9) continue; // straight edge, nothing to add

      const bulge = cur.bulge;
      const sweepAngleMag = Math.abs(4 * Math.atan(Math.abs(bulge))); // 0..2*PI
      const isCCW = bulge > 0; // DXF convention: positive bulge = CCW
      const chord = dist([cur.x, cur.y], [next.x, next.y]);
      const r = Math.abs(chord / (2 * Math.sin(sweepAngleMag / 2)));

      const mx = (cur.x + next.x) / 2, my = (cur.y + next.y) / 2;
      const dx = next.x - cur.x, dy = next.y - cur.y;
      const len = Math.hypot(dx, dy) || 1;
      const nxp = -dy / len, nyp = dx / len; // unit perpendicular to the chord
      const h = r * Math.cos(sweepAngleMag / 2); // distance from chord midpoint to center

      // A chord has two possible circle centers (one on each side). Rather
      // than assume which sign matches the bulge convention, try both and
      // keep whichever one actually produces the expected sweep angle when
      // walking from `cur` to `next` — this is the only fully reliable check
      // (confirmed by earlier debugging: trusting the sign convention alone
      // silently breaks on concave/reflex corners).
      const candidates = [
        { x: mx + nxp * h, y: my + nyp * h },
        { x: mx - nxp * h, y: my - nyp * h },
      ];
      let best = null;
      for (const c of candidates){
        const a0 = Math.atan2(cur.y - c.y, cur.x - c.x);
        const a1 = Math.atan2(next.y - c.y, next.x - c.x);
        let diff = a1 - a0;
        while (diff <= -Math.PI * 2) diff += Math.PI * 2;
        while (diff > Math.PI * 2) diff -= Math.PI * 2;
        if (isCCW && diff < 0) diff += Math.PI * 2;
        if (!isCCW && diff > 0) diff -= Math.PI * 2;
        const err = Math.abs(Math.abs(diff) - sweepAngleMag);
        if (!best || err < best.err) best = { center: c, startAngle: a0, sweep: diff, err };
      }

      const { center, startAngle, sweep } = best;
      const steps = Math.max(2, Math.ceil((Math.abs(sweep) / (2 * Math.PI)) * segmentsPerFullCircle));
      for (let s = 1; s < steps; s++){
        const a = startAngle + sweep * (s / steps);
        out.push({ x: center.x + r * Math.cos(a), y: center.y + r * Math.sin(a) });
      }
    }
    if (!closed) out.push({ x: verts[n - 1].x, y: verts[n - 1].y });
    return out;
  }

  return { dist, filletCorner, roundedPolygon, bulgeRadius, contourToSvgPath, tessellateContour, cleanRound, translate, signedArea, reverseContour, rotate, mirror };
})();


// ============================================================================
// Layers — the DXF layer registry. Every contour produced by an element
// declares which layer it belongs to; DXF export groups entities by layer
// and emits a proper LAYER table so the names/colors show up in any CAD
// tool's layer manager. Declared here even for layers nothing draws on yet,
// so the drawing is ready to receive future elements (underframe holes,
// insert cutouts, dimension lines) without touching the export code again.
// ============================================================================
const Layers = (() => {
  // DXF color index: 1=red 2=yellow 3=green 4=cyan 5=blue 6=magenta 7=white/black
  //
  // machining describes how a layer's contours should be cut, for anyone
  // reading the DXF on a CNC — not read or used by any geometry/export
  // code here (the DXF's own numbers stay the same regardless), it's
  // metadata the operator uses to set up the machine:
  //   side       — which face of the material to cut from: 'top' or
  //                'bottom' ('bottom' by default — most of this app's own
  //                geometry is drawn from the underside)
  //   depth      — cut depth in mm, or 'none' if this layer isn't milled
  //                at all (a schematic/reference layer)
  //   depthAnchor— what the depth is measured from: 'top' (from the
  //                material's top face), 'bottom' (from the face named in
  //                `side`), or 'center' (from the material's mid-plane,
  //                where the final depth is thickness/2 + depth). E.g.
  //                side='bottom', depth=5, depthAnchor='bottom' means "mill
  //                5mm deep, starting from the bottom face"; side='bottom',
  //                depth=0, depthAnchor='top' means "cut all the way
  //                through" (the bottom-side cut reaches the top face).
  //   millType   — 'contour' (just follow the path, e.g. an outline cut)
  //                or 'pocket' (clear the whole enclosed area, e.g. a
  //                recess) — 'contour' by default.
  // DIMENSIONS has no `machining` — it's pure on-screen/on-paper
  // reference, never actually cut.
  const registry = {
    OUTLINE:			{ name: 'OUTLINE',			color: 7, machining: { side: 'bottom', depth: 0, depthAnchor: 'top', millType: 'outside' } }, // tabletop silhouette
    CUTOUT:				{ name: 'CUTOUT',			color: 7, machining: { side: 'bottom', depth: 0, depthAnchor: 'top', millType: 'inside' } }, // tabletop cutouts
    PHYSICAL:			{ name: 'PHYSICAL',			color: 5 }, // physical parts that is not part of a tabletop, for reference
    UNDERFRAME:			{ name: 'UNDERFRAME',		color: 5 }, // physical underframe parts: legs, control panel
    HOLES:				{ name: 'HOLES',			color: 6, machining: { side: 'bottom', depth: 'none', depthAnchor: 'bottom', millType: 'contour' } }, // mounting holes
    UNDERFRAME_HOLES:	{ name: 'UNDERFRAME_HOLES',	color: 6, machining: { side: 'bottom', depth: 'none', depthAnchor: 'bottom', millType: 'contour' } }, // mounting holes for the underframe parts
    ELEMENTS:			{ name: 'ELEMENTS',			color: 3, machining: { side: 'bottom', depth: 'none', depthAnchor: 'bottom', millType: 'contour' } },
    ELEMENTS_BACK:		{ name: 'ELEMENTS_BACK',	color: 4, machining: { side: 'bottom', depth: 'none', depthAnchor: 'bottom', millType: 'pocket' } },
    ENGRAVING:			{ name: 'ENGRAVING',		color: 3, machining: { side: 'top', depth: 0.5, depthAnchor: 'top', millType: 'pocket' } },
    PHONESTAND:			{ name: 'PHONESTAND',		color: 3, machining: { side: 'top', depth: 11, depthAnchor: 'top', millType: 'pocket' } },
    WIRELESS_POCKET:	{ name: 'WIRELESS_POCKET',	color: 3, machining: { side: 'bottom', depth: 3, depthAnchor: 'top', millType: 'pocket' } },
    DIMENSIONS:			{ name: 'DIMENSIONS',		color: 1 }, // dimension lines — pure reference, never milled, so no `machining` at all
  };
  const all = () => Object.values(registry);
  // Returns undefined for an id not in the registry — deliberately NOT
  // falling back to OUTLINE (an earlier version did), since silently
  // reassigning unknown-layer geometry to a real layer would hide the
  // mistake instead of surfacing it. Callers that need a display name/
  // color for known-safe cases (e.g. always-valid literal layer names)
  // can still rely on the value being present; anything reading a
  // contour's own `layer` field (element-authored, so typos are possible)
  // must handle the undefined case — see RenderSVG's unknown-layer
  // handling for where that surfaces to the person.
  const get = (id) => registry[id];
  return { registry, all, get };
})();


// ============================================================================
// Elements — the plugin contract for anything that contributes geometry to
// the drawing (today: the tabletop outline itself, via TabletopOutline; in
// the future: leg-frame holes, wireless charger cutouts, USB ports, cable
// trays, etc). Each element is a plain object:
//   {
//     id: 'tabletopOutline',
//     buildContours(params) -> [{ contour: [{x,y,bulge},...], layer: 'OUTLINE' }]
//   }
// buildContours receives the full params object and returns a list of
// (contour, layer) pairs. Multiple contours let one element draw several
// disconnected shapes (e.g. a cutout element could emit both a milling
// contour and a separate schematic-only marking contour on a different
// layer). Positioning helpers below let an element resolve "20mm from the
// left edge" / "centered" / "10mm in from the top-right corner" against the
// current tabletop bounds without hardcoding tabletop knowledge into every
// element.
// ============================================================================
const Elements = (() => {
  const registry = [];
  function register(element){ registry.push(element); }
  function all(){ return registry; }

  // Resolves an anchor + offset into an absolute point, given the
  // tabletop's bounding box. `anchor` is one of: 'left','right','top',
  // 'bottom','topLeft','topRight','bottomLeft','bottomRight','center'.
  // `offset` is {x, y} in mm, added after the anchor's base position
  // (positive x = further right, positive y = further up, matching CAD
  // Y-up convention used throughout Geo).
  function resolveAnchor(anchor, offset, bounds){
    const { minX, minY, maxX, maxY } = bounds;
    const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
    const base = {
      left:        { x: minX, y: midY },
      right:       { x: maxX, y: midY },
      top:         { x: midX, y: maxY },
      bottom:      { x: midX, y: minY },
      topLeft:     { x: minX, y: maxY },
      topRight:    { x: maxX, y: maxY },
      bottomLeft:  { x: minX, y: minY },
      bottomRight: { x: maxX, y: minY },
      center:      { x: midX, y: midY },
    }[anchor] || { x: midX, y: midY };
    const off = offset || { x: 0, y: 0 };
    return { x: base.x + (off.x || 0), y: base.y + (off.y || 0) };
  }

  // For each anchor, which sign to apply to insetX/insetY so a positive
  // number means "further from that anchor, toward the opposite side" —
  // e.g. inset from topRight always pulls left/down, inset from
  // bottomLeft always pulls right/up. For a corner anchor this is a true
  // inward distance (can't sensibly go negative — the field enforces
  // that). For an edge-center anchor (top/bottom/left/right), the axis
  // running ALONG that edge has no "inward" direction to measure from —
  // there's only a horizontal (or vertical) shift left/right of center —
  // so that axis is marked `directional: false` and allowed to go
  // negative, with the same sign convention (positive = right/down) as a
  // plain coordinate shift rather than an inward distance. Both axes are
  // always shown and always meaningful now; `directional` only changes
  // whether the field allows negative numbers, not whether it's visible.
  const ANCHOR_INSET = {
    topLeft:     { signX: +1, signY: -1, directionalX: true,  directionalY: true  },
    topRight:    { signX: -1, signY: -1, directionalX: true,  directionalY: true  },
    bottomLeft:  { signX: +1, signY: +1, directionalX: true,  directionalY: true  },
    bottomRight: { signX: -1, signY: +1, directionalX: true,  directionalY: true  },
    top:         { signX: +1, signY: -1, directionalX: false, directionalY: true  },
    bottom:      { signX: +1, signY: +1, directionalX: false, directionalY: true  },
    left:        { signX: +1, signY: +1, directionalX: true,  directionalY: false },
    right:       { signX: -1, signY: +1, directionalX: true,  directionalY: false },
    center:      { signX: +1, signY: +1, directionalX: false, directionalY: false },
  };

  // Resolves an anchor + insetX/insetY into an absolute point. For a
  // directional axis (corner-to-corner, or the "inward" axis of an
  // edge-center anchor), insetX/insetY is a plain non-negative distance
  // and the sign flip below makes a bigger number always move further
  // from that anchor. For a non-directional axis (the along-the-edge
  // axis of an edge-center anchor, or either axis of 'center'), the same
  // field is instead a signed left/right (or up/down) shift — positive
  // moves right/down, negative moves left/up — since there's no "inward"
  // direction to measure from a middle point.
  function resolveInset(anchor, insetX, insetY, bounds){
    const sign = ANCHOR_INSET[anchor] || ANCHOR_INSET.center;
    const offset = {
      x: (insetX || 0) * sign.signX,
      y: (insetY || 0) * sign.signY,
    };
    return resolveAnchor(anchor, offset, bounds);
  }

  return { register, all, resolveAnchor, resolveInset, ANCHOR_INSET };
})();

// ============================================================================
// registerSimpleEmbeddable — factory for every repeatable embeddable
// element (charger, outlet block, phone stand, tray, pull-out stand, USB
// charger, pult). A list of instances, each placed by anchor+insetX/insetY,
// with the same rotate/mirror transform applied to every one of the
// element's own local-space contours before translating into place.
//
// config:
//   id         — element id, matches the id used elsewhere (e.g. Drawing)
//   paramsKey  — which p.<key> array holds this element's instances
//   variants   — { key: { parts } }. `parts` is an array of
//                { verts, layer } in the element's own local coordinates.
//                The geometry must be authored such that (0,0) is the
//                intended reference point (anchor) for all transformations
//                (rotation, mirror, translation). A single-key `variants` means
//                there's effectively no type choice (only one shape
//                exists) — the UI layer decides whether to show a type
//                selector based on how many keys are present, not this
//                factory.
//   defaultVariant — which variants key new instances default to
//   adjustPosition — optional (worldPos, p, footprint) => worldPos hook
//                for positioning logic that depends on something outside
//                this element's own geometry — currently only the
//                pull-out stand's auto-lift over the tabletop's own ergo-
//                notch needs this; every other element leaves it unset.
//   resolveInsets — optional (instance, p) => {insetX, insetY} hook for
//                elements whose inset values need something other than a
//                direct pass-through of instance.insetX/insetY — the USB
//                charger's own X follows a dynamic default (the
//                underframe's own inset + 220mm) when unset, and its Y is
//                always fixed regardless of what's configured, both
//                handled here rather than baking USB-charger-specific
//                logic into the shared buildContours below.
function registerSimpleEmbeddable({ id, paramsKey, variants, defaultVariant, adjustPosition, resolveInsets }){
  function buildContours(p){
    const instances = p[paramsKey] || [];
    const entries = [];
    const bounds = { minX: 0, minY: 0, maxX: p.W, maxY: p.H };
    for (const instance of instances){
      const data = variants[instance.type] || variants[defaultVariant];
      if (!data) continue;
      const rotation = instance.rotation || 0;
      const center = Elements.resolveInset(instance.anchor, instance.insetX, instance.insetY, bounds);
      
      for (const { verts, layer } of data.parts){
        // All transforms (mirror, rotate) are applied relative to (0,0).
        const placed = Geo.translate(Geo.rotate(Geo.mirror(verts, instance.mirror), rotation), center.x, center.y);
        entries.push({ contour: placed, layer });
      }
    }
    return entries;
  }

  Elements.register({ id, buildContours, VARIANTS: variants });
}


// ============================================================================
// Element: Tabletop outline (rectangle + optional bottom trapezoid notch +
// optional top notch). This is the one real element ported through the
// Elements contract in this refactor, proving the pattern on the geometry
// that's already been extensively verified — no math changes from the
// previous version, only where it lives.
// ============================================================================
Elements.register((() => {
  // Fixed depths for the top notch shapes, per spec: rectangle is 30mm
  // tall; the inverted-T's stem and base are each 20mm tall.
  const RECT_NOTCH_H = 30;
  const T_STEM_H = 20, T_STEM_W = 30, T_BASE_H = 20;

  function buildTopNotchCorners(p){
    const { W, H, topNotchType, topNotchWidth, topNotchOffset, rTopNotch } = p;
    if (topNotchType === 'rect' && topNotchWidth > 0) {
      const cx = W/2 + (topNotchOffset || 0);
      const topR = [cx + topNotchWidth/2, H];
      const botR = [cx + topNotchWidth/2, H - RECT_NOTCH_H];
      const botL = [cx - topNotchWidth/2, H - RECT_NOTCH_H];
      const topL = [cx - topNotchWidth/2, H];
      return [
        { pt: topR, r: rTopNotch }, { pt: botR, r: rTopNotch },
        { pt: botL, r: rTopNotch }, { pt: topL, r: rTopNotch },
      ];
    }
    if (topNotchType === 'tslot' && topNotchWidth > 0) {
      const cx = W/2 + (topNotchOffset || 0);
      const stemR_top = [cx + T_STEM_W/2, H];
      const stemR_bot = [cx + T_STEM_W/2, H - T_STEM_H];
      const baseR_top = [cx + topNotchWidth/2, H - T_STEM_H];
      const baseR_bot = [cx + topNotchWidth/2, H - T_STEM_H - T_BASE_H];
      const baseL_bot = [cx - topNotchWidth/2, H - T_STEM_H - T_BASE_H];
      const baseL_top = [cx - topNotchWidth/2, H - T_STEM_H];
      const stemL_bot = [cx - T_STEM_W/2, H - T_STEM_H];
      const stemL_top = [cx - T_STEM_W/2, H];
      return [
        { pt: stemR_top, r: rTopNotch }, { pt: stemR_bot, r: rTopNotch },
        { pt: baseR_top, r: rTopNotch }, { pt: baseR_bot, r: rTopNotch },
        { pt: baseL_bot, r: rTopNotch }, { pt: baseL_top, r: rTopNotch },
        { pt: stemL_bot, r: rTopNotch }, { pt: stemL_top, r: rTopNotch },
      ];
    }
    return [];
  }

  function buildContours(p){
    const { W, H, rTop, rBottom, rNotch, notchOn, notchH, notchBottom, notchTop } = p;
    const BL = [0, 0], BR = [W, 0], TR = [W, H], TL = [0, H];
    const topCorners = buildTopNotchCorners(p);

    let corners;
    if (notchOn && notchH > 0 && notchBottom > 0) {
      const cx = W/2;
      const nBL = [cx - notchBottom/2, 0];
      const nBR = [cx + notchBottom/2, 0];
      const nTR = [cx + notchTop/2, notchH];
      const nTL = [cx - notchTop/2, notchH];
      corners = [
        { pt: BL, r: rBottom }, { pt: nBL, r: rNotch }, { pt: nTL, r: rNotch },
        { pt: nTR, r: rNotch }, { pt: nBR, r: rNotch }, { pt: BR, r: rBottom },
        { pt: TR, r: rTop }, ...topCorners, { pt: TL, r: rTop },
      ];
    } else {
      corners = [
        { pt: BL, r: rBottom }, { pt: BR, r: rBottom },
        { pt: TR, r: rTop }, ...topCorners, { pt: TL, r: rTop },
      ];
    }

    const contour = Geo.roundedPolygon(corners);
    return [{ contour, layer: 'OUTLINE' }];
  }

  return { id: 'tabletopOutline', buildContours };
})());

// Element: Underframe (подстолье) — physical leg frames only, no control
// panel (see the separate Пульт element below for that). Vector data
// imported from ArtCAM-exported SVGs, one per size variant (60 / 70), using
// the same Bézier-to-bulge conversion as the wireless charger, extended to
// detect circular holes encoded as 4-segment cubic-Bézier approximations
// (the standard "kappa" construction CAD tools use to draw circles with
// Béziers) — these convert losslessly to exact 2-vertex bulge circles
// rather than being tessellated.
//
// The source file's combined frame+pult drawing was vertically flipped as
// a single rigid unit (not per-piece) before being split into these two
// elements, since the panel was originally authored above the frame and
// needs to end up below it — flipping preserves their relative geometry
// exactly, which independent per-piece flips would risk breaking. Winding
// direction was independently re-verified per contour after the flip
// (checked via signed area / bulge sign, not assumed), since a reflection
// reverses winding and some source contours already wound differently from
// others before any transform was applied.
//
// The right-hand leg is generated by mirroring the left-hand data across a
// vertical axis; mirroring, like the flip above, reverses winding and gets
// the same re-verification.
//
// Local coordinate convention: x=0 at the frame's own left edge, y=0 at the
// frame's own TOP edge (growing downward). The frame is centered vertically
// on the tabletop by default (a vertical inset of 0), with the inset then
// shifting it up or down from that centered position — see buildContours
// for the exact placement math.
//
// Layers: physical parts (leg profile) go on UNDERFRAME; mounting holes
// (присадка) go on UNDERFRAME_HOLES, so a CAM operator can isolate cut
// paths from reference holes.
// ============================================================================
Elements.register((() => {
  const UNDERFRAME_VARIANTS = {
    '60': {

      frameHoles: [[{x:23.0,y:20.0,bulge:1.0},{x:32.0,y:20.0,bulge:1.0}],[{x:21.5,y:20.0,bulge:1.0},{x:33.5,y:20.0,bulge:1.0}],[{x:23.0,y:425.0,bulge:1.0},{x:32.0,y:425.0,bulge:1.0}],[{x:21.5,y:425.0,bulge:1.0},{x:33.5,y:425.0,bulge:1.0}],[{x:23.0,y:150.0,bulge:1.0},{x:32.0,y:150.0,bulge:1.0}],[{x:21.5,y:150.0,bulge:1.0},{x:33.5,y:150.0,bulge:1.0}],[{x:23.0,y:555.0,bulge:1.0},{x:32.0,y:555.0,bulge:1.0}],[{x:21.5,y:555.0,bulge:1.0},{x:33.5,y:555.0,bulge:1.0}],[{x:248.5,y:287.5,bulge:1.0},{x:257.5,y:287.5,bulge:1.0}],[{x:247.0,y:287.5,bulge:1.0},{x:259.0,y:287.5,bulge:1.0}],[{x:486.0,y:287.5,bulge:1.0},{x:495.0,y:287.5,bulge:1.0}],[{x:484.5,y:287.5,bulge:1.0},{x:496.5,y:287.5,bulge:1.0}]],
    },
    '70': {
      width: 548.0, height: 575.0,
      frameOutline: [[{x:278.0,y:367.5,bulge:0},{x:298.0,y:367.5,bulge:0},{x:298.0,y:207.5,bulge:0},{x:278.0,y:207.5,bulge:0}],[{x:38.0,y:387.5,bulge:0},{x:548.0,y:387.5,bulge:0},{x:548.0,y:367.5,bulge:0},{x:38.0,y:367.5,bulge:0}],[{x:0.0,y:575.0,bulge:0},{x:38.0,y:575.0,bulge:0},{x:38.0,y:0.0,bulge:0},{x:0.0,y:0.0,bulge:0}],[{x:38.0,y:207.5,bulge:0},{x:548.0,y:207.5,bulge:0},{x:548.0,y:187.5,bulge:0},{x:38.0,y:187.5,bulge:0}],[{x:528.0,y:367.5,bulge:0},{x:548.0,y:367.5,bulge:0},{x:548.0,y:207.5,bulge:0},{x:528.0,y:207.5,bulge:0}]],

    },
  };

  function ensureCCW(verts){
    if (verts.length < 2) return verts;
    if (verts.length === 2) return verts[0].bulge > 0 ? verts : Geo.reverseContour(verts);
    return Geo.signedArea(verts) >= 0 ? verts : Geo.reverseContour(verts);
  }

  function mirrorX(verts, axisX){
    const mirrored = verts.map(v => ({ x: 2 * axisX - v.x, y: v.y, bulge: -v.bulge }));
    return ensureCCW(mirrored);
  }

  // Builds one leg-side's geometry at a given placement, optionally
  // mirrored. `leftX` is where this side's local x=0 lands on the
  // tabletop; `topY` is where this side's local y=0 (the frame's own top
  // edge) lands — i.e. the tabletop's top edge minus the vertical inset.
  function buildSide(data, leftX, topY, mirror){
    const place = (verts) => {
      let v = verts;
      if (mirror) v = mirrorX(v, data.width / 2);
      // local y grows downward from the frame's own top (y=0), so placing
      // it needs a Y flip relative to translate's plain add: worldY =
      // topY - localY.
      return v.map(pt => ({
        x: (mirror ? pt.x : pt.x) + leftX,
        y: topY - pt.y,
        bulge: mirror ? -pt.bulge : pt.bulge, // Y-flip on placement also reverses arc direction
      }));
    };
    const entries = [];
    for (const contour of data.frameOutline) entries.push({ contour: ensureCCW(place(contour)), layer: 'UNDERFRAME' });
    for (const contour of data.frameHoles) entries.push({ contour: ensureCCW(place(contour)), layer: 'UNDERFRAME_HOLES' });
    return entries;
  }

  function buildContours(p){
    if (!p.underframeType || p.underframeType === 'none') return [];
    const data = UNDERFRAME_VARIANTS[p.underframeType];
    if (!data) return [];

    const insetH = p.underframeInsetH != null ? p.underframeInsetH : 50;
    // Centered vertically by default (insetV=0): the frame's own vertical
    // midpoint lands on the tabletop's own vertical midpoint. insetV then
    // shifts it from that centered position — positive moves the frame up,
    // negative moves it down, matching this app's normal CAD Y-up
    // convention (unlike the charger's always-non-negative inset system,
    // there's no single anchor corner here to derive a sign from, so this
    // stays a plain signed offset from center).
    const insetV = p.underframeInsetV || 0;
    const topY = p.H / 2 + data.height / 2 + insetV;

    const entries = [];
    entries.push(...buildSide(data, insetH, topY, false));
    entries.push(...buildSide(data, p.W - insetH - data.width, topY, true));
    return entries;
  }

  return { id: 'underframe', buildContours, VARIANTS: UNDERFRAME_VARIANTS };
})());
