      const d = Geo.dist([p.x,p.y],[prev.x,prev.y]);
      if (d < 1e-6) continue;
      if (i < points.length - 1 && d < minLen) continue;
      pts.push(p);
    }
    while (pts.length > 2) {
      const d = Geo.dist([pts[pts.length-2].x,pts[pts.length-2].y],[pts[pts.length-1].x,pts[pts.length-1].y]);
      if (d >= minLen) break;
      pts.splice(pts.length - 2, 1);
    }
    return pts;
  }

  // True if every turn in `points` (a full path, first/last points
  // included) is 90° or gentler — no two consecutive segments fold back
  // sharper than a right angle.
  function allTurnsValid(points){
    function turnCos(dirA, dirB){
      const la = Math.hypot(dirA.x, dirA.y) || 1, lb = Math.hypot(dirB.x, dirB.y) || 1;
      return (dirA.x*dirB.x + dirA.y*dirB.y) / (la*lb);
    }
    for (let i = 0; i < points.length - 2; i++){
      const segA = { x: points[i+1].x - points[i].x, y: points[i+1].y - points[i].y };
      const segB = { x: points[i+2].x - points[i+1].x, y: points[i+2].y - points[i+1].y };
      if (Math.hypot(segA.x,segA.y) < 1e-9 || Math.hypot(segB.x,segB.y) < 1e-9) continue;
      if (turnCos(segA, segB) < -1e-9) return false;
    }
    return true;
  }

  // True if any two non-adjacent segments of `points` cross — a
  // genuinely self-crossing route, not a rounding artifact. Needed in
  // addition to allTurnsValid: a path can have every individual turn at
  // 90° or gentler and still fold back tightly enough that a LATER
  // segment crosses an EARLIER, non-adjacent one (verified in practice:
  // a short "staircase" jog whose first stub and final approach ended
  // up overlapping in space, each individual turn still exactly 90°) —
  // turn angle alone only catches adjacent-pair fold-backs, not this.
  function pathSelfIntersects(points){
    function segIntersect(p1, p2, p3, p4){
      const d1x = p2.x-p1.x, d1y = p2.y-p1.y, d2x = p4.x-p3.x, d2y = p4.y-p3.y;
      const denom = d1x*d2y - d1y*d2x;
      if (Math.abs(denom) < 1e-9) return false;
      const t = ((p3.x-p1.x)*d2y - (p3.y-p1.y)*d2x) / denom;
      const u = ((p3.x-p1.x)*d1y - (p3.y-p1.y)*d1x) / denom;
      return t > 1e-6 && t < 1-1e-6 && u > 1e-6 && u < 1-1e-6;
    }
    const n = points.length;
    for (let i = 0; i < n - 1; i++){
      for (let j = i + 2; j < n - 1; j++){
        if (segIntersect(points[i], points[i+1], points[j], points[j+1])) return true;
      }
    }
    return false;
  }

  // True if a CLOSED contour (as returned by Geo.groovePolyline — the
  // actual milled groove outline, not just its centerline) crosses
  // itself anywhere. Tessellates arcs into short line segments first
  // (same tolerance used throughout this app for tessellation) since
  // the contour's own bulge-arc vertices aren't directly comparable as
  // straight segments. This is the ground-truth safety check used as
  // buildChannelContour's own last resort: pathSelfIntersects on the
  // routed centerline catches most bad routes, but a route can still
  // produce a self-crossing GROOVE despite a clean centerline (a
  // corner's own rounding can overlap a nearby straight run even when
  // the centerline itself never crosses — verified in practice), so the
  // final decision of whether a channel is safe to emit checks the
  // actual output shape, not an upstream approximation of it.
  function contourSelfIntersects(contour){
    function segIntersect(p1, p2, p3, p4){
      const d1x = p2.x-p1.x, d1y = p2.y-p1.y, d2x = p4.x-p3.x, d2y = p4.y-p3.y;
      const denom = d1x*d2y - d1y*d2x;
      if (Math.abs(denom) < 1e-9) return false;
      const t = ((p3.x-p1.x)*d2y - (p3.y-p1.y)*d2x) / denom;
      const u = ((p3.x-p1.x)*d1y - (p3.y-p1.y)*d1x) / denom;
      return t > 1e-6 && t < 1-1e-6 && u > 1e-6 && u < 1-1e-6;
    }
    const pts = Geo.tessellateContour(contour, 32, true);
    const n = pts.length;
    for (let i = 0; i < n; i++){
      for (let j = i + 2; j < n; j++){
        if (i === 0 && j === n - 1) continue; // adjacent through the closing wrap
        if (segIntersect(pts[i], pts[(i+1)%n], pts[j], pts[(j+1)%n])) return true;
      }
    }
    return false;
  }


  // horizontal/vertical/45°-diagonal segments, as a handful of candidate
  // routes with the shortest VALID one picked — see the element's own
  // top comment for why a full search isn't needed here. "Valid" means
  // every turn in the resulting path (including where the source's own
  // stub meets the run, and where the run meets the target's own stub)
  // turns by 90° or less: a sharper fold-back turn is exactly the case
  // groovePolyline's own rounded-capsule construction can't offset
  // cleanly (the two rails of a folded-back turn cross near the joint
  // however small the fillet radius), so it's excluded as a candidate
  // rather than produced and then discovered broken. Returns an array of
  // intermediate points (NOT including a or b themselves, since the
  // caller already has those from the stubs).
  function diagonalMiddleRun(a, b, before, after, width){
    const dx = b.x - a.x, dy = b.y - a.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const sx = Math.sign(dx) || 1, sy = Math.sign(dy) || 1;
    const candidates = [];

    // Pure axis-then-axis elbows (also covers the already-axis-aligned
    // and already-diagonal cases, where one candidate collapses to a
    // straight line through the shared corner).
    candidates.push([{ x: b.x, y: a.y }]);
    candidates.push([{ x: a.x, y: b.y }]);

    // Axis-then-diagonal-then-axis, both orderings: strip off the
    // smaller of |dx|/|dy| as a 45° run, covering the leftover on the
    // longer axis as a straight leg either before or after the
    // diagonal. Both orderings are the same total length but turn
    // differently at each end, so both are offered as separate
    // candidates and filtered by turn angle below — only one (or
    // neither) may actually be a valid turn at both of its own joints.
    if (adx > 1e-6 && ady > 1e-6) {
      const straight = Math.abs(adx - ady);
      if (adx >= ady) {
        candidates.push([{ x: a.x + sx * straight, y: a.y }]);           // straight leg first (horizontal)
        candidates.push([{ x: b.x - sx * straight, y: b.y }]);           // diagonal first
      } else {
        candidates.push([{ x: a.x, y: a.y + sy * straight }]);           // straight leg first (vertical)
        candidates.push([{ x: b.x, y: b.y - sy * straight }]);           // diagonal first
      }
    }

    let bestDir = null, bestLen = Infinity;
    for (const via of candidates){
      // Validate on the MERGED path, using the REAL points before `a`
      // and after `b` (the source/target themselves, a full stub length
      // away — not a synthetic unit step) so the merge sees the true
      // segment lengths: a candidate can look like a sequence of valid
      // <=90 deg turns as drawn, but still contain a segment shorter
      // than the channel's own width, which groovePolyline then
      // collapses away internally — and that collapse can silently
      // create a genuine fold-back that wasn't visible in the pre-merge
      // path (this happened in practice: a near-zero-length dogleg
      // between two long segments running in nearly opposite
      // directions), so turn validity is always checked on the SAME
      // merged geometry groovePolyline will actually render.
      const rawPts = [before, a, ...via, b, after].filter(Boolean);
      const merged = mergeShortSegments(rawPts, width);
      if (!allTurnsValid(merged)) continue;
      if (pathSelfIntersects(merged)) continue;
      let len = 0;
      const pts = [a, ...via, b];
      for (let i = 0; i < pts.length - 1; i++) len += Geo.dist([pts[i].x,pts[i].y],[pts[i+1].x,pts[i+1].y]);
      if (len < bestLen) { bestLen = len; bestDir = via; }
    }
    // Every straight/diagonal candidate above failed the turn-angle test
    // — this happens when the two stub directions point such that no
    // single-corner (or single-diagonal) route can reach from a to b
    // without folding back on one end's own fixed direction (e.g. both
    // stubs point "away" from each other along the same axis). The
    // guaranteed-valid fallback is a jog: step out of `a` along dirIn,
    // sidestep perpendicular to line up with `b`'s own incoming line,
    // then run straight along dirOutReversed into `b`. Every turn in a
    // jog is exactly 90° by construction, so it's always valid.
    if (!bestDir) {
      const dirIn = before ? { x: a.x - before.x, y: a.y - before.y } : null;
      const dirOutReversed = after ? { x: after.x - b.x, y: after.y - b.y } : null;
      const normalize = v => { const len = Math.hypot(v.x,v.y) || 1; return { x: v.x/len, y: v.y/len }; };
      const nDirIn = dirIn ? normalize(dirIn) : null;
      const nDirOutReversed = dirOutReversed ? normalize(dirOutReversed) : null;
      // jogRoute's own construction guarantees every individual turn is
      // valid, but not that the resulting path stays clear of the fixed
      // `before`/`after` stub segments it's connecting — a jog built
      // with the default JOG_LEAD can still route back through the
      // space either stub occupies (verified in practice: a jog whose
      // very first leg exactly re-traced the source's own stub axis,
      // crossing the final approach into the target). Retrying with a
      // larger lead pushes the jog further from both stubs; a handful
      // of escalating multipliers finds a clean route whenever the two
      // fixed stub segments themselves don't already cross (that
      // separate, unfixable-by-the-middle-run case is caught upstream
      // in fullPath, which shortens both stubs until they clear before
      // this function is ever called with them).
      for (const leadMultiplier of [1, 2, 4, 8, 16]){
        const candidate = jogRoute(a, b, nDirIn, nDirOutReversed, width, leadMultiplier);
        const fullCheck = [before, a, ...candidate, b, after].filter(Boolean);
        if (!pathSelfIntersects(fullCheck)) { bestDir = candidate; break; }
      }
      // All multipliers failed (should not happen given the stub area
      // is always bounded) — fall back to the smallest jog anyway
      // rather than returning nothing, since a slightly-imperfect
      // groove is better than no channel at all.
      if (!bestDir) bestDir = jogRoute(a, b, nDirIn, nDirOutReversed, width, 1);
    }
    return bestDir;
  }

  // A guaranteed-valid 90°-only detour from a to b, respecting the fixed
  // travel directions at both ends: dirIn is the direction the path is
  // already travelling on arrival at `a` (so its first segment must turn
  // <=90 deg from dirIn), and dirOutReversed is the direction the path
  // must be travelling on arrival at `b` (so its last segment must turn
  // <=90 deg into dirOutReversed). dirIn and dirOutReversed are always
  // one of the 4 axis directions here (cableNode directions only ever
  // are), so exactly one of two constructions applies:
  //   - perpendicular axes (one horizontal, one vertical): the corner
  //     where a's own forward ray meets b's own backward ray is a single
  //     valid 90° turn at both ends, PROVIDED that corner is actually
  //     ahead of `a` along dirIn and ahead of `b` along dirOutReversed
  //     (not behind either) — checked explicitly rather than assumed,
  //     since a corner behind one end would silently create the same
  //     fold-back this function exists to avoid.
  //   - parallel axes (both horizontal, or both vertical), or the
  //     perpendicular corners above didn't pan out: a 3-point jog is
  //     used instead — forward out of a, sidestep on the perpendicular
  //     axis, forward into b.
  function jogRoute(a, b, dirIn, dirOutReversed, width, leadMultiplier){
    const JOG_LEAD = STUB_LEN * (leadMultiplier || 1);
    const cross = dirIn.x*dirOutReversed.y - dirIn.y*dirOutReversed.x;
    if (Math.abs(cross) > 1e-6) {
      // Perpendicular axes: rather than using the raw intersection of
      // a's forward ray and b's backward ray directly (which can land
      // arbitrarily close to `a` or `b` — even a fraction of a
      // millimetre away — and then get silently merged away by
      // groovePolyline's own short-segment collapse, turning what
      // looked like a valid 90° corner into a fold-back once that
      // sliver segment vanishes; this happened in practice), advance
      // from `a` by a full JOG_LEAD along dirIn and from `b` by a full
      // JOG_LEAD backward along dirOutReversed, then use whichever of
      // the two possible corners between those two ADVANCED points is
      // consistent — guaranteeing every leg is at least JOG_LEAD long
      // by construction, never a razor-thin remainder.
      const p1 = { x: a.x + dirIn.x*JOG_LEAD, y: a.y + dirIn.y*JOG_LEAD };
      const p4 = { x: b.x - dirOutReversed.x*JOG_LEAD, y: b.y - dirOutReversed.y*JOG_LEAD };
      for (const corner of [{ x: p4.x, y: p1.y }, { x: p1.x, y: p4.y }]){
        const toCorner = { x: corner.x - p1.x, y: corner.y - p1.y };
        const fromCorner = { x: p4.x - corner.x, y: p4.y - corner.y };
        // The corner just needs to not require p1->corner or
        // corner->p4 to run backward relative to dirIn/dirOutReversed;
        // when it collapses to a single point (already-aligned case)
        // that's fine too (zero-length legs there just mean p1
        // already equals p4 on this path, i.e. a straight line).
        const dIn = toCorner.x*dirIn.x + toCorner.y*dirIn.y;
        const dOut = fromCorner.x*dirOutReversed.x + fromCorner.y*dirOutReversed.y;
        if (dIn >= -1e-6 && dOut >= -1e-6) return [p1, corner, p4];
      }
    }
    // Parallel-axis case (perpendicular axes are always resolved by one
    // of the two corners above — verified exhaustively for all 4x4 axis
    // combinations, so reaching here means dirIn and dirOutReversed
    // share the same axis). Two sub-cases, since they need different
    // jog shapes:
    const alongDirIn = Math.abs(dirIn.x) > 0.5 ? 'x' : 'y';
    const sameSign = (dirIn[alongDirIn] > 0) === (dirOutReversed[alongDirIn] > 0);

    if (!sameSign) {
      // Anti-parallel (e.g. dirIn is +Y, dirOutReversed is -Y): a's own
      // forward region and b's own forward region open up facing each
      // other, so a single shared coordinate strictly beyond both
      // (forward of a by at least JOG_LEAD, AND forward of b by at
      // least JOG_LEAD measured from b backward along dirOutReversed)
      // always exists — a plain 3-point jog (forward, sidestep,
      // forward) works. Taking the further-out of the two per-point
      // minimums guarantees both legs clear JOG_LEAD.
      const aAdvanced = a[alongDirIn] + dirIn[alongDirIn]*JOG_LEAD;
      const bBacked = b[alongDirIn] - dirOutReversed[alongDirIn]*JOG_LEAD;
      const jogCoord = dirIn[alongDirIn] > 0 ? Math.max(aAdvanced, bBacked) : Math.min(aAdvanced, bBacked);
      const p1 = alongDirIn === 'x' ? { x: jogCoord, y: a.y } : { x: a.x, y: jogCoord };
      const p3 = alongDirIn === 'x' ? { x: jogCoord, y: b.y } : { x: b.x, y: jogCoord };
      return [p1, p3];
    }

    // Parallel, same direction (e.g. dirIn and dirOutReversed both +Y,
    // both stubs "facing" the same way): the point just forward of `a`
    // (p1) and the point just before `b` (p5) can end up positioned so
    // NEITHER a single sidestep NOR a same-direction crossing segment
    // reaches from one to the other without a turn sharper than 90° at
    // one end (this is the actual bug an earlier version of this
    // function had — verified by direct construction that a 3-point jog
    // is topologically impossible whenever `a` sits "behind" `b` along
    // their own shared forward direction). The general fix is a proper
    // S-jog: forward out of `a`, sidestep onto a scratch perpendicular
    // coordinate, travel along the shared axis (in EITHER direction —
    // always valid, since both of its neighboring turns are against a
    // purely perpendicular segment and are therefore always exactly
    // 90°) out past wherever `b`'s own approach point sits, sidestep
    // again onto `b`'s own line, then straight into `b`. The only real
    // constraint is that this middle axis-travel ends at a coordinate
    // positioned so the FINAL segment into `b` still matches
    // dirOutReversed — guaranteed by picking that endpoint as one
    // further JOG_LEAD step beyond `b`'s own backed-off approach point,
    // in dirOutReversed's own direction.
    const perpAxis = alongDirIn === 'x' ? 'y' : 'x';
    const p1Coord = a[alongDirIn] + dirIn[alongDirIn]*JOG_LEAD;
    const p5Coord = b[alongDirIn] - dirOutReversed[alongDirIn]*JOG_LEAD;
    // One step further BEHIND p5Coord along dirOutReversed's own
    // direction (so p4->p5 also travels in dirOutReversed's direction,
    // not its opposite) — this is where the middle axis-travel segment
    // ends, guaranteeing the turn from p4 into p5 (and from there into
    // b) is a real forward step rather than a fold-back.
    const pivotCoord = p5Coord - dirOutReversed[alongDirIn]*JOG_LEAD;
    // Any perpendicular coordinate different from both endpoints works
    // for the scratch sidestep; the midpoint keeps the detour visually
    // centered between source and target rather than hugging one side.
    // When source and target already share the same perpendicular
    // coordinate (the midpoint would then equal both, collapsing the
    // sidestep to zero width and folding the whole S back onto a single
    // line), offset by JOG_LEAD instead so there's always a real,
    // non-zero sidestep for groovePolyline's own offset rails to clear.
    const perpMidpoint = (a[perpAxis] + b[perpAxis]) / 2;
    const scratchPerp = Math.abs(perpMidpoint - a[perpAxis]) > 1e-6 ? perpMidpoint : a[perpAxis] + JOG_LEAD;
    const p1 = { [alongDirIn]: p1Coord, [perpAxis]: a[perpAxis] };
    const p2 = { [alongDirIn]: p1Coord, [perpAxis]: scratchPerp };
    const p3 = { [alongDirIn]: pivotCoord, [perpAxis]: scratchPerp };
    const p4 = { [alongDirIn]: pivotCoord, [perpAxis]: b[perpAxis] };
    const p5 = { [alongDirIn]: p5Coord, [perpAxis]: b[perpAxis] };
    return [p1, p2, p3, p4, p5];
  }


  // Full path from a source cableNode to a target cableNode: source point
  // -> source's own 50mm stub -> diagonal middle run -> target's own
  // 50mm stub -> target point. The middle run is constrained to turn by
  // no more than 90° at every joint, including where it meets each
  // stub's own fixed direction, so the whole path only ever bends
  // gently enough for groovePolyline's own rounded-capsule construction
  // to offset cleanly.
  //
  // In rare configurations (source and target close together, with
  // stub directions that happen to send the two fixed 50mm stubs
  // straight through each other's own extent — verified as a real,
  // reproducible case) the two stubs themselves cross before any
  // middle-run routing is even considered; no reshaping of the middle
  // run can fix that; since it lives entirely in the two fixed
  // segments. When that's detected, both stubs are shortened together
  // (in fixed small steps, down to a minimum) until they clear each
  // other — a shorter-but-still-present stub in the node's own
  // direction is a much smaller deviation from the spec than dropping
  // the stub concept entirely for that connection.
  function fullPath(source, target, width){
    let stubLen = STUB_LEN;
    const MIN_STUB_LEN = 10;
    let stubA = stubEnd(source, stubLen);
    let stubB = stubEnd(target, stubLen);
    while (stubLen > MIN_STUB_LEN && pathSelfIntersects([source, stubA, stubB, target])) {
      stubLen -= 5;
      stubA = stubEnd(source, stubLen);
      stubB = stubEnd(target, stubLen);
    }
    const middle = diagonalMiddleRun(stubA, stubB, source, target, width);
    return [source, stubA, ...middle, stubB, target];
  }

  // Builds one channel's groove contour, with a final safety net: if the
  // routed path's own groove still self-intersects despite every check
  // already applied while building that path (turn-angle validation,
  // merge-aware re-checking, stub-crossing detection — verified to
  // handle every case found during testing except a small residual tail
  // of configurations rare enough that hunting down each one
  // individually has sharply diminishing returns), fall back to the one
  // construction that's simplest to prove always safe: a straight
  // centerline from source directly to target, no stubs, no jog. It
  // won't exit the source/target along their own hardcoded directions
  // in that fallback case, but a plain, correctly-milled straight
  // channel is strictly better than the alternative of silently
  // emitting self-crossing toolpath geometry.
  //
  // MAX_CORNER_RADIUS is passed straight through as groovePolyline's own
  // ceiling — groovePolyline itself works out each joint's own actual
  // radius (capped by ITS two adjacent segments, not the whole path's
  // shortest one), so there's nothing left for this function to
  // pre-compute; a single short leg anywhere in the route no longer
  // flattens every other corner in the same path to a point.
  function buildChannelContour(source, target, width, layer, entries){
    const path = fullPath(source, target, width);
    const contour = Geo.groovePolyline(path, width, MAX_CORNER_RADIUS);
    if (!contourSelfIntersects(contour)) {
      entries.push({ contour, layer });
      return;
    }
    const straight = [source, target];
    entries.push({ contour: Geo.groovePolyline(straight, width, MAX_CORNER_RADIUS), layer });
  }

  function buildContours(p){
    const entries = [];

    // wirelessCharger -> T-slot notch (4x4mm channel)
    const tSlot = tSlotEntryPoints(p);
    if (tSlot) {
      for (const instance of (p.chargers || [])){
        if (!instance.cableChannel) continue;
        const variant = WIRELESS_CHARGER_VARIANTS[instance.type] || WIRELESS_CHARGER_VARIANTS.standard;
        if (!variant.cableNode) continue;
        const sourcePt = embeddableLocalToWorld(variant.cableNode, instance, p);
        const sourceDir = embeddableLocalDirToWorld(variant.cableNode.dir, instance, p);
        const source = { x: sourcePt.x, y: sourcePt.y, dir: sourceDir };
        const target = nearestPoint(source, [tSlot.left, tSlot.right]);
        buildChannelContour(source, target, 4, 'CABLE_CHANNEL_4', entries);
      }
    }

    // Generic "source -> nearest instance of a single target element"
    // routing, shared by usbCharger->small cablePocket and
    // pult(embeddedUsb)->big cablePocket below — both route to the same
    // cablePocket element, just filtered to a different `type`, so the
    // routing logic itself doesn't need to differ.
    function routeToNearestTarget(sourceInstances, sourceVariantsById, targetInstances, targetVariantsById){
      const targetNodes = worldNodes(targetInstances, targetVariantsById, p);
      if (targetNodes.length === 0) return;
      for (const instance of (sourceInstances || [])){
        if (!instance.cableChannel) continue;
        const variant = sourceVariantsById[instance.type] || sourceVariantsById.standard;
        if (!variant || !variant.cableNode) continue;
        const sourcePt = embeddableLocalToWorld(variant.cableNode, instance, p);
        const sourceDir = embeddableLocalDirToWorld(variant.cableNode.dir, instance, p);
        const source = { x: sourcePt.x, y: sourcePt.y, dir: sourceDir };
        const target = nearestPoint(source, targetNodes);
        buildChannelContour(source, target, 5.5, 'CABLE_CHANNEL_5_5', entries);
      }
    }

    // usbCharger -> nearest SMALL cablePocket (5.5x5.5mm channel)
    routeToNearestTarget(p.usbChargers, USB_CHARGER_VARIANTS, (p.cablePockets || []).filter(i => i.type === 'small'), CABLE_POCKET_VARIANTS);

    // pult(embeddedUsb) -> nearest BIG cablePocket (5.5x5.5mm channel)
    routeToNearestTarget(p.pults, PULT_VARIANTS, (p.cablePockets || []).filter(i => i.type === 'big'), CABLE_POCKET_VARIANTS);

    return entries;
  }

  return { id: 'cableChannels', buildContours };
})());


// ============================================================================
// Drawing — composes every registered element's contours into one flat list
// of { contour, layer } entries. This is the single artifact that both the
// SVG preview and the DXF exporter consume; neither needs to know how many
// elements exist or how each one builds its geometry.
// ============================================================================
const Drawing = (() => {
  function build(params){
    const entries = [];
    for (const element of Elements.all()){
      const parts = element.buildContours(params) || [];
      for (const part of parts) entries.push(part);
    }
    return entries;
  }
  return { build };
})();


// ============================================================================
// Dimensions — draws linear dimension lines (extension lines, a dimension
// line, inward-pointing arrowheads, and a centered text label) for the
// tabletop's overall width/height and for each embeddable element's own
// anchor-relative position. Built from the same plain-line contour
// primitives as everything else in this app (open, non-filled contours on
// the DIMENSIONS layer) rather than DXF's native DIMENSION entity — R12
// doesn't support DIMENSION at all, and every other design choice in this
// app already favors plain, universally-compatible primitives over
// format-specific entity types.
// ============================================================================
const Dimensions = (() => {
  const EXT_GAP = 4;        // gap between the dimensioned feature and where its extension line starts
  const EXT_OVERSHOOT = 4;  // how far the extension line extends past the dimension line itself
  const ARROW_LEN = 16;      // distance from an arrowhead's tip back to its tail, along the dimension line
  const ARROW_WIDTH = 6;
  const TEXT_GAP = 18;       // distance from the dimension line to the text's own geometric CENTER (not its baseline/edge — see dominant-baseline="central" in RenderSVG/ExportSVG and DXF group code 73 in ExportDXF), so the visual gap reads the same whether the text ends up above or below the line

  // Auto-stacking: every dimension call below picks a "desired" offset on
  // the general vicinity of what it's measuring, but on a busy drawing
  // several dimensions can legitimately want to sit at roughly the same
  // distance from roughly the same span (e.g. two chargers placed near
  // each other, or a tray next to the underframe), which used to just
  // overlap. STACK_STEP is how far a dimension gets pushed out, on top of
  // its own requested offset, for each already-placed dimension it would
  // otherwise collide with — see placeDimension below for the actual
  // collision search.
  const STACK_STEP = 34; // TEXT_GAP*2-ish: enough for one line + label not to touch the next
  const placedByAxis = { h: [], v: [] }; // reset per build() call, see resetStacking()

  function resetStacking(){
    placedByAxis.h.length = 0;
    placedByAxis.v.length = 0;
  }

  // Finds the smallest offset (same sign and axis as requested, magnitude
  // >= the requested one) whose dimension-line band doesn't overlap any
  // previously placed dimension that shares its span AND its base
  // coordinate. "Span" is the dimension's extent along its own direction
  // (e.g. a horizontal dimension's x-range); "base" is the coordinate the
  // offset is measured from (e.g. a horizontal dimension's own y, before
  // the offset is applied) — two dimensions can only collide if their
  // spans overlap, they're on the same side (same offset sign), AND they
  // share the same base, since dimensions measured from different base
  // lines (e.g. the underframe's own inset vs. the pult's own inset,
  // which sit on different y-coordinates entirely) never visually
  // interfere with each other regardless of offset.
  function placeDimension(axis, base, spanMin, spanMax, desiredOffset){
    const sign = desiredOffset >= 0 ? 1 : -1;
    const placed = placedByAxis[axis];
    let offset = desiredOffset;
    // Re-check from scratch each time offset changes, since pushing past
    // one collision can land inside another's band — a fixed-point loop
    // (rather than a single pass) is what makes this correct for 3+
    // overlapping dimensions stacked on the same side, not just 2.
    let changed = true;
    while (changed) {
      changed = false;
      for (const entry of placed) {
        if (entry.sign !== sign || entry.base !== base) continue;
        const overlaps = spanMin < entry.spanMax && spanMax > entry.spanMin;
        if (!overlaps) continue;
        const tooClose = Math.abs(Math.abs(offset) - Math.abs(entry.offset)) < STACK_STEP;
        if (tooClose) {
          offset = sign * (Math.abs(entry.offset) + STACK_STEP);
          changed = true;
        }
      }
    }
    placed.push({ spanMin, spanMax, offset, sign, base });
    return offset;
  }

  // Builds one linear dimension between p1 and p2, offset perpendicular to
  // the p1->p2 direction by `offset` (signed — sign picks which side the
  // dimension line sits on). Returns entries (open contours for the
  // extension lines, dimension line, and two arrowhead triangles) plus one
  // text label.
  //
  // The requested `offset` is treated as a minimum/preferred distance —
  // placeDimension may push it further out if it would otherwise overlap
  // an already-placed dimension covering the same span on the same side,
  // so two nearby measurements always end up stacked instead of on top of
  // each other. This only works for axis-aligned dimensions (p1.x===p2.x
  // or p1.y===p2.y), which covers every dimension this app draws.
  function buildLinearDimension(p1, p2, offset, formatText){
    const isHorizontal = p1.y === p2.y;
    const isVertical = p1.x === p2.x;
    if (isHorizontal || isVertical) {
      const axis = isHorizontal ? 'h' : 'v';
      const base = isHorizontal ? p1.y : p1.x;
      const spanMin = isHorizontal ? Math.min(p1.x, p2.x) : Math.min(p1.y, p2.y);
      const spanMax = isHorizontal ? Math.max(p1.x, p2.x) : Math.max(p1.y, p2.y);
      offset = placeDimension(axis, base, spanMin, spanMax, offset);
    }
    // A genuinely diagonal dimension (p1.x!==p2.x && p1.y!==p2.y) skips
    // stacking entirely and just uses its requested offset as-is — none
    // of this app's own dimensions are diagonal today, but a future one
    // shouldn't silently misbehave by being forced through the axis-only
    // collision model above.

    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;   // unit vector along the dimension
    const nx = -uy, ny = ux;              // unit vector perpendicular to it
    const sign = offset >= 0 ? 1 : -1;
    const absOffset = Math.abs(offset);

    const d1 = { x: p1.x + nx * offset, y: p1.y + ny * offset };
    const d2 = { x: p2.x + nx * offset, y: p2.y + ny * offset };

    const e1Start = { x: p1.x + nx * EXT_GAP * sign, y: p1.y + ny * EXT_GAP * sign };
    const e1End   = { x: p1.x + nx * (absOffset + EXT_OVERSHOOT) * sign, y: p1.y + ny * (absOffset + EXT_OVERSHOOT) * sign };
    const e2Start = { x: p2.x + nx * EXT_GAP * sign, y: p2.y + ny * EXT_GAP * sign };
    const e2End   = { x: p2.x + nx * (absOffset + EXT_OVERSHOOT) * sign, y: p2.y + ny * (absOffset + EXT_OVERSHOOT) * sign };

    // The arrowhead's tip sits exactly at the dimension line's endpoint
    // (d1 or d2) and points OUTWARD — away from the other endpoint, i.e.
    // toward p1's/p2's own side. The tail (the wide base of the triangle)
    // is ARROW_LEN back from the tip, toward the other endpoint. Passing
    // each arrow its own outward direction (rather than reusing the
    // line's own ux/uy for both ends) is what keeps the tip-vs-tail sides
    // correct without needing a sign trick on ARROW_LEN.
    function arrowTriangle(tip, dirOutward){
      const backX = tip.x - ARROW_LEN * dirOutward.x, backY = tip.y - ARROW_LEN * dirOutward.y;
      const perpX = -dirOutward.y, perpY = dirOutward.x;
      return [
        { x: tip.x, y: tip.y, bulge: 0 },
        { x: backX + perpX * ARROW_WIDTH / 2, y: backY + perpY * ARROW_WIDTH / 2, bulge: 0 },
        { x: backX - perpX * ARROW_WIDTH / 2, y: backY - perpY * ARROW_WIDTH / 2, bulge: 0 },
      ];
    }

    const entries = [
      { contour: [{ x: e1Start.x, y: e1Start.y, bulge: 0 }, { x: e1End.x, y: e1End.y, bulge: 0 }], layer: 'DIMENSIONS', closed: false },
      { contour: [{ x: e2Start.x, y: e2Start.y, bulge: 0 }, { x: e2End.x, y: e2End.y, bulge: 0 }], layer: 'DIMENSIONS', closed: false },
      { contour: [{ x: d1.x, y: d1.y, bulge: 0 }, { x: d2.x, y: d2.y, bulge: 0 }], layer: 'DIMENSIONS', closed: false },
      { contour: arrowTriangle(d1, { x: -ux, y: -uy }), layer: 'DIMENSIONS', closed: true },
      { contour: arrowTriangle(d2, { x: ux, y: uy }), layer: 'DIMENSIONS', closed: true },
    ];

    const midX = (d1.x + d2.x) / 2 + nx * TEXT_GAP * sign;
    const midY = (d1.y + d2.y) / 2 + ny * TEXT_GAP * sign;
    // Constrain the label's rotation to never read upside-down: a
    // dimension can point in any of the 4 directions along its axis
    // (e.g. the charger's inset dimension flips direction depending on
    // which anchor is selected), but the text should always read normally
    // left-to-right — so angles more than 90° from horizontal get flipped
    // by 180°. This preserves intentional choices like the height
    // dimension's bottom-to-top reading (90°) while fixing any dimension
    // that happens to run right-to-left or top-to-bottom.
    let textAngle = Math.atan2(dy, dx);
    if (textAngle > Math.PI / 2 || textAngle <= -Math.PI / 2) {
      textAngle += Math.PI;
      if (textAngle > Math.PI) textAngle -= 2 * Math.PI;
    }
    const texts = [{ x: midX, y: midY, text: formatText(len), angle: textAngle }];

    return { entries, texts };
  }

  function formatMm(len){
    const rounded = Math.round(len * 10) / 10;
    return (Number.isInteger(rounded) ? rounded : rounded.toFixed(1)) + ' мм';
  }

  // Builds the overall width/height dimensions for the tabletop, plus
  // dimension lines for every other configurable measurement (notch
  // widths/heights, element insets) except fillet radii, which the user
  // asked to leave undimensioned. Offsets/insets that default to zero are
  // only dimensioned when the person has actually set them to something
  // else — a zero offset has nothing meaningful to measure.
  function build(params){
    if (!params.dimensionsOn) return { entries: [], texts: [] };
    resetStacking(); // fresh collision state for this build — each call to Dimensions.build lays out an independent drawing
    const { W, H } = params;
    const gap = 30; // distance the overall dimension lines sit from the tabletop's own edge
    const entries = [];
    const texts = [];

    function add(dim){ entries.push(...dim.entries); texts.push(...dim.texts); }

    // Overall width (below) and height (left).
    add(buildLinearDimension({ x: 0, y: 0 }, { x: W, y: 0 }, -gap, formatMm));
    add(buildLinearDimension({ x: 0, y: 0 }, { x: 0, y: H }, gap, formatMm));

    // Bottom trapezoid notch: width at the tabletop's bottom edge, width at
    // the notch's own flat top, and its height.
    if (params.notchOn) {
      const cx = W / 2;
      const nBL = { x: cx - params.notchBottom / 2, y: 0 };
      const nBR = { x: cx + params.notchBottom / 2, y: 0 };
      const nTL = { x: cx - params.notchTop / 2, y: params.notchH };
      const nTR = { x: cx + params.notchTop / 2, y: params.notchH };
      // Stacked further out (gap 60) than the overall width dimension
      // (gap 30), since both sit on the same bottom edge.
      add(buildLinearDimension(nBL, nBR, -60, formatMm));
      // The notch's flat top isn't on the tabletop's own edge, so its
      // width is dimensioned as an internal line just above that edge.
      add(buildLinearDimension(nTL, nTR, 12, formatMm));
      // Height: a local vertical dimension just to the right of the
      // notch, inside the tabletop — the left side is already used by
      // the overall height dimension.
      add(buildLinearDimension({ x: nBR.x, y: 0 }, { x: nBR.x, y: params.notchH }, 15, formatMm));
    }

    // Top notch (T-slot or rectangular): width, and horizontal offset
    // from center only when the person has actually shifted it.
    if (params.topNotchType !== 'none') {
      const cx = W / 2 + params.topNotchOffset;
      const half = params.topNotchWidth / 2;
      // Placed above the tabletop (mirrors the overall-width placement
      // pattern, but on the opposite edge, so it never collides with the
      // bottom-notch stack).
      add(buildLinearDimension({ x: cx - half, y: H }, { x: cx + half, y: H }, gap, formatMm));
      if (params.topNotchOffset !== 0) {
        add(buildLinearDimension({ x: W / 2, y: H }, { x: cx, y: H }, gap + 25, formatMm));
      }
    }

    // Shared per-instance dimensioning for anchor-based embeddable
    // elements: draws a short local line from the resolved anchor point
    // to the element's own center along each axis, skipping zero insets
    // so nothing draws a zero-length "phantom" dimension. Both axes are
    // always dimensioned now — insetX/insetY are always meaningful
    // (directional distance for a corner axis, or a signed left/right or
    // up/down shift for an edge-center/center axis), matching how
    // Elements.resolveInset resolves the same instances' actual position.
    function dimensionInstanceList(instances){
      for (const instance of (instances || [])) {
        if (instance.dimensionsOn === false) continue;
        const bounds = { minX: 0, minY: 0, maxX: W, maxY: H };
        const anchorPt = Elements.resolveAnchor(instance.anchor, { x: 0, y: 0 }, bounds);
        const center = Elements.resolveInset(instance.anchor, instance.insetX, instance.insetY, bounds);
        if (instance.insetX) {
          add(buildLinearDimension({ x: anchorPt.x, y: center.y }, { x: center.x, y: center.y }, 10, formatMm));
        }
        if (instance.insetY) {
          add(buildLinearDimension({ x: center.x, y: anchorPt.y }, { x: center.x, y: center.y }, 10, formatMm));
        }
      }
    }

    // All embeddable elements now share the same instance dimensioning,
    // since resolveItems() in the UI managers already computed any
    // dynamic defaults (e.g. USB/pult following the underframe). Looping
    // over every registered element with a `paramsKey` (rather than
    // listing each params.* field by hand here) means a newly added
    // element is dimensioned automatically the moment it's registered —
    // this used to be a separate hardcoded list and silently missed
    // elements added after it was last updated (bigCablePockets and
    // smallCablePockets had no dimension lines for exactly this reason).
    for (const element of Elements.all()){
      if (element.paramsKey) dimensionInstanceList(params[element.paramsKey]);
    }

    // Underframe: dimension each inset only when nonzero. The horizontal
    // inset measures directly from the tabletop's left edge (its own
    // definition). The vertical inset is a shift away from the frame's
    // centered reference position, so it's dimensioned as that shift, not
    // as the full distance from the tabletop's center.
    if (params.underframeType !== 'none') {
      const data = Elements.all().find(e => e.id === 'underframe').VARIANTS[params.underframeType];
      if (data) {
        const insetH = params.underframeInsetH;
        const insetV = params.underframeInsetV || 0;
        const centeredTopY = H / 2 + data.height / 2;
        const actualTopY = centeredTopY + insetV;
        if (insetH !== 0) {
          add(buildLinearDimension({ x: 0, y: actualTopY + 10 }, { x: insetH, y: actualTopY + 10 }, 0, formatMm));
        }
        if (insetV !== 0) {
          add(buildLinearDimension({ x: -15, y: centeredTopY }, { x: -15, y: actualTopY }, 0, formatMm));
        }
      }
    }

    return { entries, texts };
  }

  return { build, buildLinearDimension, formatMm };
})();


// ============================================================================
// Render.SVG — Drawing -> <svg> markup for the live preview pane. Every
// contour's style comes straight from its own layer's entry in
// Layers.registry (see styleFor below), so a newly registered layer
// renders correctly with zero changes needed here.
// ============================================================================
const RenderSVG = (() => {
  // A layer's own `style` (from Layers.registry) becomes an inline SVG
  // style attribute directly — no separate CSS class to keep in sync
  // with the registry. `vector-effect: non-scaling-stroke` is applied to
  // every layer here (it only matters for the live, zoomable on-screen
  // preview — Export.SVG below does NOT use it, since an exported file's
  // strokes should scale with the drawing like real ink, not stay a
  // fixed screen-pixel width regardless of zoom).
  function styleFor(layer){
    const def = Layers.get(layer);
    if (!def || !def.style) return null; // unknown layer -> caller falls back to layer-unknown
    const { stroke, fillOpacity = 0, strokeWidth = 1.5, dashed = false } = def.style;
    const fill = fillOpacity > 0 ? stroke : 'none';
    return `fill:${fill};fill-opacity:${fillOpacity};stroke:${stroke};stroke-width:${strokeWidth}px;` +
      `vector-effect:non-scaling-stroke;${dashed ? `stroke-dasharray:${strokeWidth*3} ${strokeWidth*2};` : ''}`;
  }

  function build(entries, W, H, texts = []){
    const parts = entries.map(({ contour, layer, closed = true }) => {
      const d = Geo.contourToSvgPath(contour, true, H, closed);
      // A contour naming a layer that isn't in the registry gets flagged
      // visually (layer-unknown, a blinking red outline — see its CSS)
      // instead of silently falling back to layer-outline as this used
      // to — that fallback was hiding the exact mistake this is meant to
      // surface (an element referencing a layer id that doesn't exist).
      const style = styleFor(layer);
      // open lines/arrowheads shouldn't inherit the layer's closed-shape
      // fill, regardless of that layer's own fillOpacity.
      const attrs = style ? ` style="${style}${closed ? '' : ';fill:none'}"` : ' class="layer-unknown"';
      return `<path${attrs} d="${d}"></path>`;
    });
    const dimStroke = (Layers.get('DIMENSIONS') || {}).style?.stroke || '#e05a5a';
    const textParts = texts.map(({ x, y, text, angle = 0 }) => {
      const sy = H - y; // flip to SVG's Y-down space, matching contourToSvgPath's own flip
      const deg = -angle * 180 / Math.PI; // SVG rotation is clockwise-positive in Y-down space, opposite of our CAD angle convention
      return `<text class="dim-text" style="fill:${dimStroke}" x="${x}" y="${sy}" transform="rotate(${deg} ${x} ${sy})" text-anchor="middle" dominant-baseline="central">${text}</text>`;
    });
    return parts.join('\n') + (textParts.length ? '\n' + textParts.join('\n') : '');
  }

  return { build };
})();


// ============================================================================
// Export.DXF — Drawing -> DXF R12 (AC1009) text. R12 was chosen (over the
// newer LWPOLYLINE-based R2000+) because it only needs HEADER + TABLES +
// ENTITIES with simple name references — no owner-handle bookkeeping — and
// is read by effectively every DXF-capable tool. Each layer gets its own
// POLYLINE per contour, grouped under a proper LAYER table so names/colors
// appear correctly in any CAD layer manager, including layers with no
// geometry yet (reserved for planned features).
// ============================================================================
const ExportDXF = (() => {
  const ARC_SEGMENTS_PER_CIRCLE = 128; // keeps tessellated arcs visually smooth

  function buildLayerTable(add){
    const layers = Layers.all();
    add(0,'SECTION'); add(2,'TABLES');
    add(0,'TABLE'); add(2,'LAYER'); add(70, layers.length);
    for (const layer of layers){
      add(0,'LAYER');
      add(2, layer.name);
      add(70, 0);
      add(62, layer.color);
      add(6, 'CONTINUOUS');
    }
    add(0,'ENDTAB');
    add(0,'ENDSEC');
  }

  function buildEntities(add, entries, texts){
    add(0,'SECTION'); add(2,'ENTITIES');
    for (const { contour, layer, closed = true } of entries){
      // An entry referencing a layer not in the registry still gets
      // written out (using the raw layer string as its DXF layer name)
      // rather than silently reassigned to a known layer or dropped —
      // the person sees this case highlighted in the on-screen preview
      // (see RenderSVG's own unknown-layer handling) so they can fix the
      // element that produced it; the export just needs to not crash.
      const known = Layers.get(layer);
      const layerName = known ? known.name : layer;
      const points = Geo.tessellateContour(contour, ARC_SEGMENTS_PER_CIRCLE, closed);

      add(0,'POLYLINE');
      add(8, layerName);
      add(66,1);   // "vertices follow" marker, required for POLYLINE
      add(70, closed ? 1 : 0);
      add(40,0);   // default start width
      add(41,0);   // default end width

      for (const pt of points){
        add(0,'VERTEX');
        add(8, layerName);
        add(10, Geo.cleanRound(pt.x).toFixed(4));
        add(20, Geo.cleanRound(pt.y).toFixed(4));
        add(30, 0);
      }

      add(0,'SEQEND');
      add(8, layerName);
    }

    const TEXT_HEIGHT_MM = 21;
    for (const { x, y, text, angle = 0 } of (texts || [])){
      const cx = Geo.cleanRound(x), cy = Geo.cleanRound(y);
      add(0,'TEXT');
      add(8, Layers.get('DIMENSIONS').name);
      add(10, cx.toFixed(4));
      add(20, cy.toFixed(4));
      add(30, 0);
      add(40, TEXT_HEIGHT_MM);
      add(1, text);
      add(50, (angle * 180 / Math.PI).toFixed(4)); // DXF rotation is degrees, CCW from X-axis — matches our CAD angle convention directly, no flip needed
      add(72, 1); // horizontal alignment: center
      add(73, 2); // vertical alignment: middle — matches the SVG side's dominant-baseline="central", so (x,y) means the text's true geometric center in both outputs, not its baseline
      add(11, cx.toFixed(4)); // alignment point, required when 72/73 are nonzero
      add(21, cy.toFixed(4));
      add(31, 0);
    }

    add(0,'ENDSEC');
  }

  function build(entries, texts){
    const lines = [];
    const add = (code, value) => { lines.push(String(code)); lines.push(String(value)); };

    add(0,'SECTION'); add(2,'HEADER');
    add(9,'$ACADVER'); add(1,'AC1009');
    add(0,'ENDSEC');

    buildLayerTable(add);
    buildEntities(add, entries, texts);

    add(0,'EOF');
    return lines.join('\r\n') + '\r\n';
  }

  function downloadAs(entries, filename, texts){
    let name = (filename || 'panel').trim();
    if (!name) name = 'panel';
    if (!/\.dxf$/i.test(name)) name += '.dxf';

    const dxfText = build(entries, texts);
    const blob = new Blob([dxfText], { type: 'application/dxf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { build, downloadAs };
})();


// ============================================================================
// Export.SVG — Drawing -> a standalone, downloadable SVG file. Distinct from
// RenderSVG (the live preview pane): an exported file has to carry
// concrete numeric style values baked into each element (fill/stroke/
// stroke-width as plain attributes, not vector-effect:non-scaling-stroke —
// see BASE_STROKE_WIDTH_MM below), since it's opened outside this app and
// can't rely on the app's own CSS or on-screen scaling behavior. Reads the
// same Layers.registry `style` field RenderSVG does, so the exported file
// visually matches what was on screen. Coordinates are written in real
// millimeters with an explicit mm-based viewBox/width/height, and Y is
// flipped to match SVG's native top-down convention (the same flip
// RenderSVG applies for on-screen display) so the file opens right-side-up
// in any SVG viewer.
// ============================================================================
const ExportSVG = (() => {
  const BBOX_MARGIN_MM = 6; // extra breathing room around the computed content bounds, beyond the geometry itself

  // Computes the true bounding box across every entry's contour points and
  // every text label's approximate footprint. Dimension lines/arrows/text
  // routinely extend outside the tabletop's own [0,W]x[0,H] footprint, so
  // sizing the export purely off W/H clips them — this walks the actual
  // geometry instead of assuming any fixed extent.
  function computeBounds(entries, texts, W, H){
    let minX = 0, minY = 0, maxX = W, maxY = H; // tabletop itself is always included
    for (const { contour } of entries){
      for (const v of contour){
        if (v.x < minX) minX = v.x;
        if (v.x > maxX) maxX = v.x;
        if (v.y < minY) minY = v.y;
        if (v.y > maxY) maxY = v.y;
      }
    }
    // Text labels aren't stored as contour points, so approximate each
    // one's footprint from its position — rotated text can extend in
    // either axis regardless of the label's own orientation, so a
    // generous square margin around the anchor point is simpler and safer
    // than trying to compute exact rotated-text extents.
    const TEXT_FOOTPRINT_MM = 85; // half-width allowance for a realistic label (DIM_TEXT_HEIGHT_MM-tall monospace, ~7-8 characters like "1500 мм") — width dominates over height for these short numeric+unit labels
    for (const { x, y } of texts){
      if (x - TEXT_FOOTPRINT_MM < minX) minX = x - TEXT_FOOTPRINT_MM;
      if (x + TEXT_FOOTPRINT_MM > maxX) maxX = x + TEXT_FOOTPRINT_MM;
      if (y - TEXT_FOOTPRINT_MM < minY) minY = y - TEXT_FOOTPRINT_MM;
      if (y + TEXT_FOOTPRINT_MM > maxY) maxY = y + TEXT_FOOTPRINT_MM;
    }
    return {
      minX: minX - BBOX_MARGIN_MM, minY: minY - BBOX_MARGIN_MM,
      maxX: maxX + BBOX_MARGIN_MM, maxY: maxY + BBOX_MARGIN_MM,
    };
  }

  // Reads styling straight from Layers.registry's own `style` field
  // (same source RenderSVG's live preview uses) rather than a separate
  // hardcoded list — an exported file can't depend on this app's
  // stylesheet, so this still needs to bake concrete stroke/fill values
  // into the file rather than referencing a CSS class, but it no longer
  // needs its OWN copy of what those values are.
  function styleFor(layer){
    const def = Layers.get(layer) || Layers.get('OUTLINE');
    const { stroke, fillOpacity = 0 } = def.style || { stroke: '#ff8a3d' };
    return { stroke, fillOpacity };
  }
  const BASE_STROKE_WIDTH_MM = 1; // stroke width in the drawing's own mm units — deliberately NOT vector-effect:non-scaling-stroke, since that keeps strokes hairline-thin in CSS pixels no matter how large the file is rasterized (e.g. for PNG export); specifying width in mm makes it scale naturally with resolution

  // Dimension label text height, in the drawing's own mm units. The
  // on-screen preview's text (see .dim-text in the stylesheet) is a FIXED
  // number of screen pixels regardless of table size, so it always looks
  // the same relative size on screen. Exported text is real mm on the
  // drawing, so once rasterized to a typically much larger PNG (e.g.
  // 3000px+ wide for a 1500mm table) and then viewed at reduced zoom in an
  // image viewer, the same nominal size reads much smaller than the fixed-
  // px preview. This value is deliberately large (much bigger than a
  // literal drafting-standard text height) to compensate for that —
  // tune it here if exports still look too small or too large relative to
  // the preview.
  const DIM_TEXT_HEIGHT_MM = 21;

  // strokeWidthMultiplier scales BASE_STROKE_WIDTH_MM up or down — exposed
  // as a parameter (rather than hardcoded) so line thickness can be tuned
  // per export without hunting through the function body.
  function build(entries, W, H, texts = [], strokeWidthMultiplier = 1){
    const bounds = computeBounds(entries, texts, W, H);
    const bw = bounds.maxX - bounds.minX, bh = bounds.maxY - bounds.minY;
    // contourToSvgPath's Y-flip is anchored at H (world y=0 -> svg y=H,
    // world y=H -> svg y=0); that formula stays correct for points outside
    // [0,H] too, so only the viewBox's origin/size need to grow to reveal
    // them — the flip math itself doesn't change.
    const svgMinY = H - bounds.maxY;

    const strokeWidth = BASE_STROKE_WIDTH_MM * strokeWidthMultiplier;
    const paths = entries.map(({ contour, layer, closed = true }) => {
      // Round each vertex before it hits the path string, same rationale
      // as the DXF exporter's cleanRound — this is a final-output
      // checkpoint (unlike the live on-screen preview via RenderSVG,
      // which skips this for performance since it re-renders on every
      // keystroke and doesn't need the extra decimal-place cleanup).
      const roundedContour = contour.map(v => ({ x: Geo.cleanRound(v.x), y: Geo.cleanRound(v.y), bulge: v.bulge }));
      const d = Geo.contourToSvgPath(roundedContour, true, H, closed);
      const { stroke, fillOpacity } = styleFor(layer);
      const fill = closed && fillOpacity > 0 ? stroke : 'none';
      const fillOpacityAttr = closed && fillOpacity > 0 ? ` fill-opacity="${fillOpacity}"` : '';
      return `<path d="${d}" fill="${fill}"${fillOpacityAttr} stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
    });
    const textEls = texts.map(({ x, y, text, angle = 0 }) => {
      const sy = H - y;
      const deg = -angle * 180 / Math.PI;
      const { stroke: dimStroke } = styleFor('DIMENSIONS');
      return `<text x="${x}" y="${sy}" transform="rotate(${deg} ${x} ${sy})" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-weight="bold" font-size="${DIM_TEXT_HEIGHT_MM}" fill="${dimStroke}" stroke="none">${text}</text>`;
    });
    return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n` +
      `<svg xmlns="http://www.w3.org/2000/svg" width="${bw}mm" height="${bh}mm" viewBox="${bounds.minX} ${svgMinY} ${bw} ${bh}">\n` +
      paths.join('\n') + '\n' +
      textEls.join('\n') + '\n' +
      `</svg>\n`;
  }

  function downloadAs(entries, W, H, filename, texts, strokeWidthMultiplier){
    let name = (filename || 'panel').trim();
    if (!name) name = 'panel';
    if (!/\.svg$/i.test(name)) name += '.svg';

    const svgText = build(entries, W, H, texts, strokeWidthMultiplier);
    const blob = new Blob([svgText], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { build, downloadAs, computeBounds };
})();


// ============================================================================
// Export.PNG — rasterizes the same drawing ExportSVG produces into a PNG
// file, entirely in the browser (Image + Canvas, no server or library).
// Since the drawing lives in millimeters with no inherent pixel size, the
// caller supplies a scale in pixels-per-mm; the canvas is sized to
// W*scale × H*scale so the exported bitmap has a predictable, consistent
// resolution regardless of on-screen zoom. A solid white background is
// painted first — the SVG itself has no background, and a transparent PNG
// of thin colored lines is hard to read in most image viewers/printers.
// ============================================================================
const ExportPNG = (() => {
  const DEFAULT_SCALE = 2;               // pixels per mm — the UI no longer exposes this, but it's easy to change here if a different default is ever needed
  const DEFAULT_STROKE_WIDTH_MULTIPLIER = 1.5; // multiplies ExportSVG's base stroke width (see BASE_STROKE_WIDTH_MM there) — raise this if lines are still too thin
  const BORDER_MARGIN_MM = 50;           // gap between the drawing's own edge and the border
  const BORDER_WIDTH_MM = 0;           // border line thickness, in the same mm units as the drawing

  function rasterize(entries, W, H, texts, scale = DEFAULT_SCALE, strokeWidthMultiplier = DEFAULT_STROKE_WIDTH_MULTIPLIER){
    return new Promise((resolve, reject) => {
      const svgText = ExportSVG.build(entries, W, H, texts, strokeWidthMultiplier);
      const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);

      // The SVG's own content may extend beyond the tabletop's W×H (e.g.
      // dimension lines) — size the canvas off the same bounding box
      // ExportSVG.build used for its viewBox, not the raw tabletop
      // dimensions, or anything outside W×H gets cropped off the PNG.
      const bounds = ExportSVG.computeBounds(entries, texts, W, H);
      const contentW = bounds.maxX - bounds.minX, contentH = bounds.maxY - bounds.minY;

      const img = new Image();
      img.onload = () => {
        const margin = BORDER_MARGIN_MM * scale;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(contentW * scale + margin * 2));
        canvas.height = Math.max(1, Math.round(contentH * scale + margin * 2));
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, margin, margin, contentW * scale, contentH * scale);

        const borderWidth = BORDER_WIDTH_MM * scale;
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = borderWidth;
        ctx.strokeRect(borderWidth / 2, borderWidth / 2, canvas.width - borderWidth, canvas.height - borderWidth);

        URL.revokeObjectURL(svgUrl);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('canvas.toBlob returned null'));
        }, 'image/png');
      };
      img.onerror = () => {
        URL.revokeObjectURL(svgUrl);
        reject(new Error('Failed to rasterize SVG for PNG export'));
      };
      img.src = svgUrl;
    });
  }

  async function downloadAs(entries, W, H, filename, texts, scale, strokeWidthMultiplier){
    let name = (filename || 'panel').trim();
    if (!name) name = 'panel';
    if (!/\.png$/i.test(name)) name += '.png';

    const blob = await rasterize(entries, W, H, texts, scale, strokeWidthMultiplier);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { rasterize, downloadAs };
})();


// ============================================================================
// UI — wires the parameter form to Drawing / RenderSVG / ExportDXF. Kept
// deliberately thin: it only reads inputs into a plain params object, asks
// Drawing for the current geometry, and hands that to the renderer or
// exporter. No geometry logic lives here.
// ============================================================================
(function UI(){
  const el = id => document.getElementById(id);

  // ---------- Generic instance-list manager ----------
  // Every repeatable element (chargers, outlet blocks, phone stands,
  // trays, pull-out stands, USB chargers) follows the same UI pattern: a
  // JS array is the source of truth, rows are rebuilt into a DOM
  // container whenever the array changes, and each row's inputs mutate
  // their own instance object directly. This factory captures that
  // pattern once instead of repeating it per element — `rowHtml` builds
  // one row's inner markup from an instance + its index, `defaults`
  // supplies a new instance's starting values, and `extraFieldNames`
  // lists any select fields (besides the anchor field every list has)
  // that need special "changing this repaints the whole row" handling,
  // e.g. a variant/type selector.
  function createInstanceListManager({ containerId, addBtnId, itemLabel, defaults, rowHtml, onChange, onFieldChange, dimensionsDefault = true, onTypeChange = null }){
    // A new project starts with none of these instances — the user adds
    // only what they actually need, rather than getting one by default
    // and having to delete it. (Loading a saved project still restores
    // whatever list that project had, via setItems below.)
    let items = [];
    // onFieldChange (defaults to onChange if not given separately) is
    // what fires per keystroke on a row's own text/number field — kept
    // distinguishable from add/remove's onChange so callers can debounce
    // just the keystroke-driven path (see debouncedRender's own comment)
    // without also delaying the instant feedback of clicking + Add or
    // Remove, which aren't bursty and shouldn't feel laggy.
    const fieldChange = onFieldChange || onChange;

    function add(){
      items.push({ ...defaults(), dimensionsOn: dimensionsDefault });
      renderList();
      onChange();
    }

    function remove(idx){
      items.splice(idx, 1);
      renderList();
      onChange();
    }
    function renderList(){
      const container = el(containerId);
      container.innerHTML = '';
      items.forEach((instance, idx) => {
        const row = document.createElement('div');
        row.className = 'instance-row';
        row.innerHTML = `
          <div class="instance-row-header">
            <span class="instance-row-title">${itemLabel} №${idx + 1}</span>
            <button type="button" class="instance-remove-btn" data-idx="${idx}">Удалить</button>
          </div>
          <div class="toggle-row">
            <span>Размерные линии</span>
            <label class="switch">
              <input type="checkbox" data-field="dimensionsOn" data-idx="${idx}">
              <span class="track"></span>
            </label>
          </div>
          ${rowHtml(instance, idx)}
        `;
        // Restore select values explicitly — setting them via the HTML
        // string's `value` attribute doesn't reliably select the right
        // <option> for dynamically-built markup, same as the charger's
        // original list logic. Checkboxes need the same explicit restore
        // treatment, since a `checked` attribute string in rowHtml can't
        // carry boolean state reliably either. Undefined dimensionsOn
        // (an instance saved before this field existed, from any
        // element) reads as ON — old projects keep showing their
        // dimensions on load rather than silently losing them — while a
        // freshly created instance gets an explicit true/false from
        // dimensionsDefault (see createInstanceListManager), which is
        // what lets an element opt OUT of dimensions by default (cable
        // pockets, phone stand) without affecting saved projects.
        row.querySelectorAll('select[data-field]').forEach(sel => {
          sel.value = instance[sel.dataset.field];
        });
        row.querySelectorAll('input[type="checkbox"][data-field="dimensionsOn"]').forEach(cb => {
          cb.checked = instance.dimensionsOn !== false;
        });
        row.querySelectorAll('input[type="checkbox"][data-field]:not([data-field="dimensionsOn"])').forEach(cb => {
          cb.checked = !!instance[cb.dataset.field];
        });
        container.appendChild(row);
      });

      container.querySelectorAll('[data-field]:not(.anchor-grid-btn)').forEach(input => {
        const handler = () => {
          const idx = parseInt(input.dataset.idx, 10);
          const field = input.dataset.field;
          const isNumeric = input.type === 'number';
          const isCheckbox = input.type === 'checkbox';
          // A blank numeric field is kept as null (rather than coerced to
          // 0) so fields with a computed placeholder default — like the
          // USB charger's insetX — can fall back to that live default in
          // buildContours instead of silently becoming a real zero inset.
          items[idx][field] = isCheckbox ? input.checked
            : isNumeric ? (input.value === '' ? null : (parseFloat(input.value) || 0))
            : input.value;
          if (field === 'type' && onTypeChange) onTypeChange(items[idx]);
          if (input.tagName === 'SELECT') {
            renderList(); // a select change may affect which fields this row shows (e.g. anchor axis visibility)
          }
          // Number/text fields fire on every keystroke — debounced, so
          // typing "150" into an inset field re-renders once after the
          // person pauses, not three times for "1", "15", "150". A select
          // or checkbox change is a single discrete click, not a typing
          // burst, so it stays instant.
          if (isNumeric || input.type === 'text') fieldChange();
          else onChange();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      // Anchor-grid buttons aren't <select>/<input> so they don't fire
      // input/change — handled separately via click. Same downstream
      // effect as a select change (anchor affects which X/Y fields this
      // row shows), so it re-renders the list the same way.
      container.querySelectorAll('.anchor-grid-btn[data-field]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx, 10);
          const field = btn.dataset.field;
          items[idx][field] = btn.dataset.value;
          renderList();
          onChange();
        });
      });
      container.querySelectorAll('.instance-remove-btn').forEach(btn => {
        btn.addEventListener('click', () => remove(parseInt(btn.dataset.idx, 10)));
      });
    }

    el(addBtnId).addEventListener('click', add);
    renderList();

    // setItems replaces the whole instance list wholesale (used by
    // project load) — each loaded instance is merged over a fresh
    // defaults() so a saved file from an older version of the app that's
    // missing a newer field still gets that field's current default
    // rather than ending up undefined. An empty saved list is kept
    // empty — the user may have deliberately removed every instance of
    // this element before saving, and that's exactly what a reload
    // should restore, not silently re-add one with default values.
    function setItems(newItems){
      items = (newItems || []).map(it => ({ ...defaults(), ...it }));
      renderList();
    }

    return { get items(){ return items; }, renderList, setItems };
  }

  // 3x3 grid layout order (row-major, matches how the buttons visually
  // read left-to-right/top-to-bottom) mapped to each cell's anchor value
  // and a title tooltip — same 9 anchors as Elements.ANCHOR_INSET, just
  // presented spatially instead of as text. The center cell doubles as
  // the tabletop's overall center reference.
  const ANCHOR_GRID_CELLS = [
    { anchor: 'topLeft',     title: 'Верхний левый угол' },
    { anchor: 'top',         title: 'Центр верхней стороны' },
    { anchor: 'topRight',    title: 'Верхний правый угол' },
    { anchor: 'left',        title: 'Центр левой стороны' },
    { anchor: 'center',      title: 'Центр столешницы' },
    { anchor: 'right',       title: 'Центр правой стороны' },
    { anchor: 'bottomLeft',  title: 'Нижний левый угол' },
    { anchor: 'bottom',      title: 'Центр нижней стороны' },
    { anchor: 'bottomRight', title: 'Нижний правый угол' },
  ];

  // Builds the anchor-grid markup for one instance row. Kept as a
  // function (not a static string like the old ANCHOR_OPTIONS_ALL) since
  // each button needs its own data-idx, and the active cell needs to be
  // marked up-front so it's correct even before renderList's restore step
  // runs (avoids a one-frame flash of no selection).
  function anchorGridHtml(idx, currentAnchor){
    const cells = ANCHOR_GRID_CELLS.map(({ anchor, title }) => `
      <button type="button" class="anchor-grid-btn${anchor === currentAnchor ? ' active' : ''}"
        data-field="anchor" data-idx="${idx}" data-value="${anchor}"
        title="${title}" aria-label="${title}"></button>
    `).join('');
    return `<div class="anchor-grid">${cells}</div>`;
  }

  // Builds the "Повернуть" (rotation, degrees, counter-clockwise) +
  // "Отразить" (mirror: none/horizontal/vertical) row shared by every
  // embeddable element — both fields sit side by side, matching the
  // anchor row's own two-column layout above, and both transforms are
  // applied around the element's own anchor/reference point (see each
  // element's own buildContours), not its visual center, so rotating or
  // mirroring never moves the point the person actually positioned.
  function transformFieldsHtml(idx, inst){
    return `
      <div class="row2">
        <div class="field">
          <label>Повернуть <span class="unit">°, CCW</span></label>
          <input type="number" data-field="rotation" data-idx="${idx}" value="${inst.rotation || 0}" step="1">
        </div>
        <div class="field">
          <label>Отразить</label>
          <select data-field="mirror" data-idx="${idx}">
            <option value="none">Нет</option>
            <option value="vertical">По вертикали</option>
            <option value="horizontal">По горизонтали</option>
          </select>
        </div>
      </div>`;
  }

  // Opt-in cable-channel toggle, reused by the three element managers that
  // support a cable channel to/from a hardcoded node (see the
  // cableChannels element): wireless charger (-> T-slot notch), USB
  // charger and embeddedUsb pult (-> nearest wireless charger pocket).
  // `label` names what the channel connects to, since that differs per
  // element.
  function cableChannelToggleHtml(idx, inst, label){
    return `
      <div class="toggle-row">
        <span>${label}</span>
        <label class="switch">
          <input type="checkbox" data-field="cableChannel" data-idx="${idx}">
          <span class="track"></span>
        </label>
      </div>`;
  }

  // Builds the anchor-picker + insetX/insetY row shared by every anchor-
  // based embeddable element (charger, outlet block, phone stand, tray,
  // pull-out stand). Both fields are always shown with the same "Отступ
  // по X"/"Отступ по Y" labels regardless of anchor — the two fields
  // don't change meaning depending on what they're near, only their
  // allowed range does: for a directional axis (corner-to-corner, or the
  // "inward" axis of an edge-center anchor) a negative value doesn't mean
  // anything so the field enforces min="0"; for a non-directional axis
  // (the along-the-edge axis of an edge-center anchor, or either axis of
  // 'center') the same field is a signed left/right or up/down shift, so
  // negative values are allowed. This mirrors Elements.ANCHOR_INSET's own
  // directionalX/directionalY exactly, so the UI's constraint always
  // matches what resolveInset actually does with the number. Also
  // includes the shared rotate/mirror row (transformFieldsHtml) below the
  // anchor+inset row, since every element using this shares that too.
  function insetFieldsHtml(idx, inst) {
    const info = Elements.ANCHOR_INSET[inst.anchor] || Elements.ANCHOR_INSET.center;
    const minX = info.directionalX ? ' min="0"' : '';
    const minY = info.directionalY ? ' min="0"' : '';
    const xVal = inst.insetX != null ? inst.insetX : '';
    const yVal = inst.insetY != null ? inst.insetY : '';
    return `
      <div class="anchor-row">
        <div class="field">
          <label class="anchor-grid-label">Точка отсчёта</label>
          ${anchorGridHtml(idx, inst.anchor)}
        </div>
        <div class="field-col">
          <div class="field">
            <label>Отступ по X <span class="unit">мм</span></label>
            <input type="number" data-field="insetX" data-idx="${idx}" value="${xVal}"${minX} step="1">
          </div>
          <div class="field">
            <label>Отступ по Y <span class="unit">мм</span></label>
            <input type="number" data-field="insetY" data-idx="${idx}" value="${yVal}"${minY} step="1">
          </div>
        </div>
      </div>
      ${transformFieldsHtml(idx, inst)}`;
  }


  // ---------- Embeddable-element manager factory ----------
  // Shared machinery for every anchor-positioned, repeatable element
  // (charger, tray, cable pocket, etc.): auto-creates its UI section,
  // wires up the instance list, and resolves per-instance defaults —
  // removing the need to hand-roll onChange handling, default
  // transforms, or rowHtml separately for each element.

  // Ensures the given simple element has its own UI section (a fieldset
  // with a title, an empty list container, and an "+ Add" button) inside
  // the controls panel. Every element in this app gets its section this
  // way — none of them have any hand-written HTML for it — so a brand-new
  // element never needs its own HTML block either: passing `key` +
  // `label` to createEmbeddableManager is enough, and this function fills
  // in the container/button ids from `key` and builds the markup on the
  // fly. The existence check just guards against double-creating a
  // section if this is ever accidentally called twice for the same key.
  function ensureElementSection(key, label, addLabel){
    const containerId = `${key}List`;
    const addBtnId = `add${key.charAt(0).toUpperCase()}${key.slice(1)}Btn`;
    if (!document.getElementById(containerId)) {
      const fieldset = document.createElement('fieldset');
      fieldset.innerHTML = `
        <legend>${label}</legend>
        <div id="${containerId}"></div>
        <button type="button" id="${addBtnId}" class="btn-add">+ ${addLabel}</button>
      `;
      document.getElementById('controls').appendChild(fieldset);
    }
    return { containerId, addBtnId };
  }

  function createEmbeddableManager(cfg) {
    const { key, label, typeSelector = null, cableChannelLabel = null, cableChannelWhen = null, addLabel, dimensionsDefault = true, typeDefaults = null } = cfg;
    // Every element's UI section is auto-created from `key`+`label` — see
    // ensureElementSection — so there's no hand-written HTML to keep in
    // sync when adding a new element, and the panel's own visible order
    // is simply the order createEmbeddableManager is called in.
    const { containerId, addBtnId } = ensureElementSection(key, label, addLabel || `Добавить: ${label}`);
    const container = containerId, btn = addBtnId;
    // Defaults are kept as-is (raw) here since a value may be a function
    // (evaluated lazily per-instance, per-render — see evalVal) rather
    // than a plain literal.
    const rawDefaults = { rotation: 0, mirror: 'none', ...cfg.defaults };
    const showTypeSelector = typeSelector && typeSelector.options.length > 1;
    
    // Resolves a default value that may be a plain literal or a function
    // of (inst, p) — insetX/insetY/anchor can all be given either way.
    const evalVal = (val, inst, p) => typeof val === 'function' ? val(inst, p) : val;

    // Resolves the defaults for one instance's own `type`: the shared
    // rawDefaults, with anything present in typeDefaults[type] layered
    // on top — e.g. cablePocket's two sizes each declare their own
    // anchor/insetX/insetY as one flat object per type, instead of a
    // single function per field with a type check baked inside (which
    // gets harder to read the moment a third type shows up). Elements
    // with no typeDefaults at all (most of them) just get rawDefaults
    // back unchanged.
    function defaultsForType(type){
      if (!typeDefaults || !typeDefaults[type]) return rawDefaults;
      return { ...rawDefaults, ...typeDefaults[type] };
    }

    const mgr = createInstanceListManager({
      containerId: container,
      addBtnId: btn,
      itemLabel: label,
      dimensionsDefault,
      // insetX/insetY are always started at null (empty) for a new
      // instance. `anchor` CAN be given as a function (or, via typeDefaults, a
      // different literal per type) too — unlike insetX/insetY, which
      // stay null until the person actually sets them and are evaluated
      // live on every render (so they track a changing default, like the
      // underframe's own position), `anchor` has no "placeholder"
      // concept in the UI, so it's resolved ONCE here at creation time
      // instead, using whatever `type` default is already set.
      defaults: () => {
        const d = defaultsForType(rawDefaults.type);
        return { ...d, anchor: evalVal(d.anchor, d, {}), insetX: null, insetY: null };
      },
      onChange: () => render(),
      onFieldChange: () => debouncedRender(),
      // Called whenever an existing instance's own `type` select changes
      // (see createInstanceListManager's generic field handler) — resets
      // `anchor` to the new type's own default, same one-time resolution
      // as instance creation above, so switching type doesn't leave a
      // stale anchor from the previous type sitting there unexplained.
      // insetX/insetY are deliberately left alone: if the person already
      // has a specific position they care about, changing type shouldn't
      // silently move it — they stay null (still showing this type's own
      // live placeholder default) unless the person had already
      // overridden them, in which case that override is preserved.
      onTypeChange: typeDefaults ? (inst) => {
        const d = defaultsForType(inst.type);
        if (d.anchor !== undefined) inst.anchor = evalVal(d.anchor, d, {});
      } : null,
      rowHtml: (inst, idx) => {
        let html = '';
        if (showTypeSelector) {
          html += `
            <div class="field">
              <label>${typeSelector.label}</label>
              <select data-field="type" data-idx="${idx}">
                ${typeSelector.options.map(o => `<option value="${o.value}">${o.text}</option>`).join('')}
              </select>
            </div>`;
        }
        html += insetFieldsHtml(idx, inst);
        if (cableChannelLabel && (!cableChannelWhen || cableChannelWhen(inst))) {
          html += cableChannelToggleHtml(idx, inst, cableChannelLabel);
        }
        return html;
      }
    });

    // Refreshes every row's placeholder (the greyed-out number shown when
    // insetX/insetY is empty) to that instance's own type's current
    // default — called on every render, since the default itself can
    // depend on other params (e.g. the underframe's own position).
    mgr.updatePlaceholders = (p) => {
      const containerEl = document.getElementById(container);
      if (!containerEl) return;
      
      containerEl.querySelectorAll('.instance-row').forEach((row, idx) => {
        const inst = mgr.items[idx];
        if (!inst) return;
        
        const d = defaultsForType(inst.type);
        const defX = evalVal(d.insetX, inst, p);
        const defY = evalVal(d.insetY, inst, p);
        
        const inpX = row.querySelector('input[data-field="insetX"]');
        if (inpX && defX != null) inpX.placeholder = defX;
        
        const inpY = row.querySelector('input[data-field="insetY"]');
        if (inpY && defY != null) inpY.placeholder = defY;
      });
    };
